<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Sora:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3F0EA; --card: #FFFDF9; --ink: #2C2620; --muted: #766B60; --line: #E1DAD0; --accent: #4F6441;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15130F; --card: #201C17; --ink: #ECE5DB; --muted: #A69A8B; --line: #352F27; --accent: #A4BA8F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15130F; --card: #201C17; --ink: #ECE5DB; --muted: #A69A8B; --line: #352F27; --accent: #A4BA8F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 3rem 16px; }
h1, h2 { font-family: "Space Grotesk", Inter, sans-serif; line-height: 1.2; margin: 0 0 .5rem; }
h1 { font-size: 2rem; }
.muted { color: var(--muted); }
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-top: 2rem; }
.app { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem;
  color: var(--ink); text-decoration: none; }
.app:hover { border-color: var(--accent); }
.app h2 { font-size: 1.15rem; color: var(--accent); }
.app p { margin: 0; color: var(--muted); }
.app .brand { display: flex; align-items: center; gap: .65rem; margin-bottom: .7rem; }
.app .brand svg { width: 38px; height: 38px; flex: none; color: var(--accent); }
.app .brand h2 { margin: 0; font: 600 1.25rem/1.05 Sora, Inter, sans-serif; color: var(--ink); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Welcome</h1>
  <p class="muted">Pick where you're headed.</p>
  <!-- One card per app. Each app lives in its own folder. -->
  <div class="apps">
    <a class="app" href="sitstart/">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M15.5 27 12 22.5l-5.5-3-4.5-2 .6-5L7.5 9 12 7l2.5-3 4.5-1 3 2.5 4 1 2 5 2.5 4.5-.5 11z" fill="currentColor"/><rect x="1.5" y="24.2" width="9" height="2.8" rx=".9" fill="currentColor"/></svg>
        <h2>Sit Start</h2>
      </div>
      <p>Students: sign in to see your training plan.</p>
    </a>
    <a class="app" href="topout/">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2.5 28 8 16.5l4.5-3.5 3.5 2 4.5-6 4 4.5L29.5 28z" fill="currentColor"/><path d="M20.5 9V2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M21.4 2.6 27 4.4l-5.6 1.9z" fill="currentColor"/></svg>
        <h2>Top Out</h2>
      </div>
      <p>Adult Team coaches: roster, check-ins and the calendar.</p>
    </a>
  </div>
</main>
</body>
</html>
