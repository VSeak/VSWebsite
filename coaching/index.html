      : '<section class="card"><p class="muted">No students yet. Add your first one.</p></section>'}</div>
    <aside>
      <section class="card"><h2>Add a Student</h2>
        <p class="hint">Build their plan and add a goal first, then add their email and send the invite from their page.</p>
        <form id="addForm" class="stack" data-save>
          <label>First Name<input name="first_name" required data-need="Enter their first name." autocomplete="off"></label>
          <label>Last Name<input name="last_name" autocomplete="off"></label>
          ${pronounsField()}
          <button class="primary">+ Add Student</button>
        </form>
      </section>
      <section class="card feed"><h2>Latest Student Notes</h2>
        <p class="hint">The newest notes your students left on their sessions. Open one to reply in the plan.</p>
        ${feed || '<p class="muted">No notes yet.</p>'}</section>
    </aside>
  </div>`);

  $('#addForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const first_name = f.get('first_name').trim(), last_name = f.get('last_name').trim(), pronouns = readPronouns(f);
    busy(e.submitter, async () => {
      const data = await sb.from('students').insert({ first_name, last_name, pronouns }).select('id').single().then(must);
      flash(`${first_name} added. Make ${pro(pronouns).their} plan, then send the invite when it's ready.`);
      goTo('#/student/' + data.id);
    });
  };
}

// ---------- Coaches (students.coach_id, history from coaches_of()) ----------

// A coach who comes back has one row in coaches_of(), so they're never both current and past.
const fmtMonth = t => new Date(t).toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
const coachSpan = c => c.is_current ? 'Since ' + fmtMonth(c.started_at)
  : c.ended_at ? `${fmtMonth(c.started_at)} – ${fmtMonth(c.ended_at)}` : 'From ' + fmtMonth(c.started_at);
const coachRow = c => `<li class="coach"><span>${esc(c.name)}</span><span class="muted">${coachSpan(c)}</span></li>`;
function coachesHTML(coaches, none) {
  const cur = coaches.find(c => c.is_current), past = coaches.filter(c => !c.is_current);
  return (cur ? `<ul class="list">${coachRow(cur)}</ul>` : none ? `<p class="muted">${none}</p>` : '')
    + (past.length ? `<h3 class="goal-group">Past Coaches</h3><ul class="list">${past.map(coachRow).join('')}</ul>` : '');
}

// ---------- Pages: a long list shows a few items at a time, with Newer and Older buttons ----------

const pageCount = (n, size) => Math.max(1, Math.ceil(n / size));
// The page's items, and the page (1 on up) kept in range, e.g. after a delete empties the last page.
function pageOf(list, page, size) {
  const p = Math.min(Math.max(1, page), pageCount(list.length, size));
  return [list.slice((p - 1) * size, p * size), p];
}
// names: the buttons, for a list that isn't newest first.
const pagerHTML = (page, n, size, names = ['Newer', 'Older']) => n > size ? `<nav class="pager" aria-label="Pages">
  <button type="button" class="small ghost" data-page="${page - 1}"${page > 1 ? '' : ' disabled'}>‹ ${names[0]}</button>
  <span class="muted">Page ${page} of ${pageCount(n, size)}</span>
  <button type="button" class="small ghost" data-page="${page + 1}"${page < pageCount(n, size) ? '' : ' disabled'}>${names[1]} ›</button></nav>` : '';
// go(page) redraws box. The pager stays where it was on screen (under a thumb on a phone) and keeps the focus.
function bindPager(box, go) {
  box.querySelector('.pager')?.addEventListener('click', e => {
    const b = e.target.closest('[data-page]');
    if (!b) return;
    const i = [...b.parentElement.children].indexOf(b), top = b.getBoundingClientRect().top;
    go(+b.dataset.page);
    const pager = box.querySelector('.pager');
    if (!pager) return;
    const nb = pager.children[i];
    window.scrollBy(0, nb.getBoundingClientRect().top - top);
    (nb.disabled ? pager.querySelector('button:not(:disabled)') : nb)?.focus({ preventScroll: true });
  });
}
// A box that shows draw(page) and pages by itself. at: { page }, kept across redraws of the card around it.
function pagedBox(box, at, draw) {
  const go = n => { at.page = n; box.innerHTML = draw(at.page); bindPager(box, go); };
  bindPager(box, go);
}

// ---------- Sessions card: Next Session (students.next_*) and Session History (session_history) ----------
// Coaches and admins set the next session; the student sees it at the top of their page until it ends.
// An ended next session shows as the newest past session straight away (historyOf), and is logged in
// session_history when someone updates or clears it (logEnded). Coaches and admins can add or delete past sessions.

const NEXT_COLS = 'next_date,next_start,next_end,next_location';
const fmtTime = t => new Date('1970-01-01T' + t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const localToday = () => new Date().toLocaleDateString('en-CA');   // YYYY-MM-DD in local time
// Once it has ended it isn't "next" any more: the student stops seeing it and the coach is asked to set a new one.
const nextPassed = s => !s.next_date || new Date(`${s.next_date}T${s.next_end}`) <= new Date();
const nextOverdue = s => !!s.next_date && nextPassed(s);
const nextDay = s => day(s.next_date).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
const nextWhen = s => `${nextDay(s)} · ${fmtTime(s.next_start)} – ${fmtTime(s.next_end)}`;
const hm = t => t ? t.slice(0, 5) : '';
const HISTORY_PAGE = 3;   // past sessions per page

// Past sessions newest first, with an ended next session that isn't logged yet on top.
function historyOf(log, s) {
  const list = [...log];
  if (nextOverdue(s) && !log.some(h => h.session_date === s.next_date && hm(h.start_time) === hm(s.next_start)))
    list.push({ session_date: s.next_date, start_time: s.next_start, end_time: s.next_end, location: s.next_location });
  return list.sort((a, b) => b.session_date.localeCompare(a.session_date) || b.start_time.localeCompare(a.start_time));
}
// Before the next session changes, keep it in the history if it has ended. Logging it twice does nothing.
async function logEnded(id, s, log) {
  if (!nextOverdue(s)) return;
  const rows = await sb.from('session_history').upsert({ student_id: id, session_date: s.next_date, start_time: s.next_start,
    end_time: s.next_end, location: s.next_location }, { onConflict: 'student_id,session_date,start_time', ignoreDuplicates: true })
    .select().then(must);
  log?.push(...rows);
}
const historyItem = (h, right = '') => `<li class="hist"><span><strong>${esc(fmtSessionDay(h.session_date))}</strong>
  <span class="item-sub">${fmtTime(h.start_time)} – ${fmtTime(h.end_time)} · ${esc(h.location)}</span></span>${right}</li>`;
// "12 sessions since Mar 2026".
const historyCount = list => list.length ? `<p class="muted hist-count">${list.length} ${list.length === 1 ? 'session' : 'sessions'} since
  ${day(list.at(-1).session_date).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })}</p>` : '';

// One page of past sessions. hist = { log, page, notes? }: notes(date) counts Coach Notes from that day,
// for a Notes button, or Add Notes when there are none (the student page only). Every row can be deleted: an ended next session that isn't
// logged yet (no id) is deleted by clearing the next session without logging it.
function historyHTML(s, hist) {
  const list = historyOf(hist.log, s), [shown, page] = pageOf(list, hist.page, HISTORY_PAGE);
  hist.page = page;
  const right = h => {
    const n = hist.notes?.(h.session_date) || 0;
    const btns = (!hist.notes ? '' : n ? `<button type="button" class="small ghost" data-hist-notes="${h.session_date}">Notes (${n})</button>`
      : `<button type="button" class="small ghost" data-hist-add-notes="${h.session_date}">Add Notes</button>`)
      + `<button type="button" class="small ghost danger" data-hist-del="${h.id || 'next'}">Delete</button>`;
    return `<div class="row">${btns}</div>`;
  };
  return `${historyCount(list)}
    ${shown.length ? `<ul class="list">${shown.map(h => historyItem(h, right(h))).join('')}</ul>` : '<p class="muted">No past sessions yet.</p>'}
    ${pagerHTML(page, list.length, HISTORY_PAGE)}
    <button type="button" class="small" data-hist-add style="margin-top:.6rem">+ Add Past Session</button>`;
}

function sessionsCardHTML(s) {
  const p = pro(s.pronouns), ended = !!s.training_ended_at, overdue = !ended && nextOverdue(s);
  return `<section class="card${overdue ? ' overdue' : ''}" id="nextCard">
    <div class="row between"><h2>Sessions</h2>${overdue ? '<span class="tag warn">Needs Update</span>' : ''}</div>
    <p class="hint">${ended ? `Coaching has ended, so there's no next session. ${p.They} can still see ${p.their} past sessions.`
      : `${p.They} ${p.v('see', 'sees')} the next session at the top of ${p.their} page until it ends. Then it moves to Session History, which ${p.they} ${p.v('see', 'sees')} too.`}</p>
    ${ended ? '' : `<h3 class="sub-head">Next Session</h3>
    ${overdue ? `<p class="warn-box" role="status"><strong>This session is over.</strong>
      It ended on ${esc(nextDay(s))} and is now in Session History. Pick the new date and time below.</p>`
      : s.next_date ? '' : '<p class="muted">No next session set yet.</p>'}
    <form id="nextForm" class="stack" data-save>
      <label>Date<input type="date" name="next_date" value="${esc(s.next_date || '')}" min="${localToday()}"
        required data-need="Pick the day." data-low="Pick today or a later day."></label>
      <div class="row">
        <label class="grow" style="min-width:120px">Start Time<input type="time" name="next_start" value="${hm(s.next_start)}" required data-need="Pick a start time."></label>
        <label class="grow" style="min-width:120px">End Time<input type="time" name="next_end" value="${hm(s.next_end)}" required data-need="Pick an end time."></label>
      </div>
      <label>Location<input name="next_location" value="${esc(s.next_location || '')}" maxlength="200" required
        data-need="Say where it is." autocomplete="off" placeholder="e.g. Gym/Wall"></label>
      <div class="row"><button class="primary">Save Session</button>
        ${s.next_date ? '<button type="button" class="ghost danger" data-act="next-clear">Clear</button>' : ''}</div>
    </form>`}
    <h3 class="sub-head">Session History</h3>
    <div id="historyBox"></div>
  </section>`;
}

// The fields for a past session added by hand (in ask()). End Time's min follows Start Time (bindSessions).
const pastSessionFields = () => `<div class="stack">
  <label>Date<input type="date" name="session_date" max="${localToday()}" required data-need="Pick the day." data-high="Pick today or an earlier day."></label>
  <div class="row">
    <label class="grow" style="min-width:120px">Start Time<input type="time" name="start_time" required data-need="Pick a start time."></label>
    <label class="grow" style="min-width:120px">End Time<input type="time" name="end_time" required data-need="Pick an end time." data-low="End after the start time."></label>
  </div>
  <label>Location<input name="location" maxlength="200" required data-need="Say where it was." autocomplete="off" placeholder="e.g. Gym/Wall"></label></div>`;
const addMinute = t => {
  const [h, m] = t.split(':').map(Number), n = Math.min(h * 60 + m + 1, 1439);
  return `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;
};

// Saves or clears the next session (redrawing the card), and runs Session History in place.
// hist = { log, page, notes?, showNotes?, addNotes?, changed? }: showNotes(date) opens Coach Notes from that day;
// addNotes(date) starts a Coach Note for that day;
// changed() runs after the next session or the history changes.
function bindSessions(id, s, hist) {
  const box = $('#historyBox');
  const drawHistory = () => {
    box.innerHTML = historyHTML(s, hist);
    bindPager(box, page => { hist.page = page; drawHistory(); });
  };
  hist.redraw = drawHistory;   // e.g. after a Coach Note changes its Notes count
  drawHistory();
  // Changes the next session and redraws the card. keep: log an ended one in the history first.
  const save = (btn, patch, msg, keep = true) => busy(btn, async () => {
    if (keep) await logEnded(id, s, hist.log);
    Object.assign(s, await sb.from('students').update(patch).eq('id', id).select(NEXT_COLS).single().then(must));
    hist.page = 1;
    $('#nextCard').outerHTML = sessionsCardHTML(s);
    bindSessions(id, s, hist);
    hist.changed?.();
    flash(msg);
  });
  const noNext = { next_date: null, next_start: null, next_end: null, next_location: null };
  box.onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.histNotes) hist.showNotes?.(b.dataset.histNotes);
    else if (b.dataset.histAddNotes) hist.addNotes?.(b.dataset.histAddNotes);
    else if (b.dataset.histDel === 'next') {
      if (await ask({ title: 'Delete This Session?', ok: 'Delete', warn: true,
        body: `<p>${esc(fmtSessionDay(s.next_date))} comes off ${pro(s.pronouns).their} Session History, and the next session is cleared. This can't be undone.</p>` }))
        save(b, noNext, 'Session deleted.', false);
    } else if (b.dataset.histDel) {
      const h = hist.log.find(x => x.id === b.dataset.histDel);
      if (h && await ask({ title: 'Delete This Session?', ok: 'Delete', warn: true,
        body: `<p>${esc(fmtSessionDay(h.session_date))} comes off ${pro(s.pronouns).their} Session History. This can't be undone.</p>` }))
        busy(b, async () => {
          must(await sb.from('session_history').delete().eq('id', h.id));
          hist.log.splice(hist.log.indexOf(h), 1);
          drawHistory();
          hist.changed?.();
          flash('Session deleted.');
        });
    } else if ('histAdd' in b.dataset) {
      const asked = ask({ title: 'Add a Past Session', ok: 'Add Session', body: pastSessionFields() });
      const dlg = $('#dlg'), start = dlg.querySelector('[name="start_time"]'), end = dlg.querySelector('[name="end_time"]');
      start.addEventListener('input', () => { end.min = start.value ? addMinute(start.value) : ''; });
      const f = await asked;
      if (!f) return;
      busy(b, async () => {
        const { data, error } = await sb.from('session_history').insert({ student_id: id, session_date: f.get('session_date'),
          start_time: f.get('start_time'), end_time: f.get('end_time'), location: f.get('location').trim() }).select().single();
        if (error) throw error.code === '23505' ? new Error('That session is already in the history.') : error;
        hist.log.push(data);
        hist.page = Math.ceil((historyOf(hist.log, s).indexOf(data) + 1) / HISTORY_PAGE);   // the page it landed on
        drawHistory();
        hist.changed?.();
        flash('Session added.');
      });
    }
  };

  const form = $('#nextForm');
  if (!form) return;
  form.onsubmit = e => {
    e.preventDefault();
    const f = new FormData(form), start = f.get('next_start'), end = f.get('next_end');
    if (end <= start) return fieldError(form.elements.next_end, 'End after the start time.');
    save(e.submitter, { next_date: f.get('next_date'), next_start: start, next_end: end,
      next_location: f.get('next_location').trim() }, 'Next session saved.');
  };
  form.querySelector('[data-act="next-clear"]')?.addEventListener('click', async e => {
    e.stopPropagation();   // not the page's own data-act handler
    if (await ask({ title: 'Clear the Next Session?', ok: 'Clear', warn: true,
      body: `<p>${pro(s.pronouns).They} won't see a next session until you set one.${nextOverdue(s) ? ' It stays in Session History.' : ''}</p>` }))
      save(e.target, noNext, 'Next session cleared.');
  });
}

// The student's own past sessions, near the bottom of their page, a page at a time. Hidden until they have one.
function studentHistory(log, next) {
  const list = historyOf(log, next || {});
  let page = 1;
  const draw = () => {
    const [shown, p] = pageOf(list, page, HISTORY_PAGE);
    return `${historyCount(list)}<ul class="list">${shown.map(h => historyItem(h)).join('')}</ul>${pagerHTML(p, list.length, HISTORY_PAGE)}`;
  };
  return {
    html: list.length ? `<section class="card" style="margin-top:2rem"><h2>Your Sessions</h2>
      <p class="hint">Every session you've had with your coach, newest first.</p><div id="myHistory">${draw()}</div></section>` : '',
    bind() {
      const box = $('#myHistory');
      const go = n => { page = n; box.innerHTML = draw(); bindPager(box, go); };
      if (box) bindPager(box, go);
    },
  };
}

// ---------- Coaching Status card (students.training_ended_at: null while they are coached) ----------

function trainingCardHTML(s) {
  const done = s.training_ended_at, p = pro(s.pronouns);
  return `<section class="card" id="trainingCard" data-fold-start>
    <div class="row between"><h2>Coaching Status</h2><span class="tag${done ? '' : ' ok'}">${done ? 'Inactive' : 'Active'}</span></div>
    <p class="hint">${done ? `Coaching ended ${fmtDay(done)}. ${p.Their} plans, goals and notes are kept, and ${p.they} can still sign in.`
      : `When ${p.they} ${p.v('stop', 'stops')} being coached, end coaching here. ${p.They} ${p.v('move', 'moves')} to Inactive on the Students list.`}</p>
    <button type="button" class="${done ? 'primary' : 'ghost'}" data-act="training">${done ? 'Resume Coaching' : 'End Coaching'}</button>
  </section>`;
}

// Ends their coaching (clearing the next session, after logging it if it has ended) or resumes it, then redraw() the page.
function bindTraining(id, s, redraw) {
  $('#trainingCard [data-act="training"]').addEventListener('click', async e => {
    e.stopPropagation();   // not the page's own data-act handler
    const done = !s.training_ended_at, btn = e.currentTarget, p = pro(s.pronouns);
    if (done && !await ask({ title: `End Coaching for ${s.first_name}?`, ok: 'End Coaching',
      body: `<p>${p.They} ${p.v('move', 'moves')} to Inactive and ${p.their} next session is cleared. Plans, goals, notes and past sessions stay, and ${p.they} can still sign in.</p>` })) return;
    busy(btn, async () => {
      if (done) await logEnded(id, s);
      must(await sb.from('students').update(done
        ? { training_ended_at: new Date().toISOString(), next_date: null, next_start: null, next_end: null, next_location: null }
        : { training_ended_at: null }).eq('id', id));
      flash(done ? `Coaching ended for ${s.first_name}.` : `Coaching resumed for ${s.first_name}.`);
      redraw();
    });
  });
}

// What the student sees: nothing once the day has passed.
const nextSessionAlert = s => s && !nextPassed(s) ? `<div class="alert next-session"><strong>Next session:</strong>
  ${esc(nextWhen(s))}<br><span class="muted">${esc(s.next_location)}</span></div>` : '';

// ---------- Goals (current → achieved or archived) ----------

const fmtDay = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
// Current goals oldest first; achieved and archived newest first.
const sortGoals = goals => goals.sort((a, b) =>
  ((b.status === 'current') - (a.status === 'current')) ||
  (a.status === 'current' ? a.created_at.localeCompare(b.created_at) : (b.done_at || '').localeCompare(a.done_at || '')));
const goalItem = (g, sub, right) => `<li class="goal"><div class="goal-text"><p>${para(g.body)}</p>
  ${sub ? `<span class="item-sub">${sub}</span>` : ''}</div>${right}</li>`;

const GOALS_PAGE = 3;   // goals per page, in each group
const goalBtns = (g, ...list) => `<div class="row">${list.map(([act, label, cls]) =>
  `<button type="button" class="small ${cls || 'ghost'}" data-act="${act}" data-goal="${g.id}">${label}</button>`).join('')}</div>`;
// Each group pages by itself. Current goals are oldest first, so their buttons aren't Newer and Older.
const GOAL_GROUPS = {
  current: [g => goalItem(g, '', goalBtns(g, ['goal-achieved', 'Achieved', 'primary'], ['goal-edit', 'Edit'], ['goal-archive', 'Archive'])),
    ['Previous', 'Next']],
  achieved: [g => goalItem(g, 'Achieved ' + fmtDay(g.done_at), goalBtns(g, ['goal-current', 'Undo'], ['goal-archive', 'Archive']))],
  archived: [g => goalItem(g, 'Archived ' + fmtDay(g.done_at), goalBtns(g, ['goal-current', 'Restore'], ['goal-delete', 'Delete', 'ghost danger']))],
};
// One group's page (at[st].page, kept in range here), with its pager.
function goalGroupHTML(goals, st, at) {
  const list = goals.filter(g => g.status === st), [item, names] = GOAL_GROUPS[st], [shown, page] = pageOf(list, at[st].page, GOALS_PAGE);
  at[st].page = page;
  return `<ul class="list">${shown.map(item).join('')}</ul>${pagerHTML(page, list.length, GOALS_PAGE, names)}`;
}

function coachGoalsHTML(goals, p, at) {
  const n = st => goals.filter(g => g.status === st).length;
  const box = st => `<div data-goals="${st}">${goalGroupHTML(goals, st, at)}</div>`;
  return `<h2>Goals</h2>
    <p class="hint">${p.They} ${p.v('see', 'sees')} current and achieved goals on ${p.their} page. Archived goals are hidden from ${p.them}.</p>
    ${n('current') ? box('current') : '<p class="muted">No current goals.</p>'}
    <form id="goalForm" class="row" data-save style="margin-top:.6rem">
      <input name="body" class="grow" maxlength="500" required data-need="Write the goal first." autocomplete="off" placeholder="e.g. Send a V5 by spring">
      <button class="primary">+ Add Goal</button>
    </form>
    ${n('achieved') ? `<h3 class="goal-group">Achieved</h3>${box('achieved')}` : ''}
    ${n('archived') ? `<details class="goal-group"${at.archivedOpen ? ' open' : ''}><summary>Archived (${n('archived')})</summary>${box('archived')}</details>` : ''}`;
}

// ---------- Coach Notes (coach_notes: coaches only; a session_date makes it notes from that session) ----------

// Newest first, by the session's day (or the day a general note was written).
const cnoteDay = n => n.session_date || new Date(n.created_at).toLocaleDateString('en-CA');
const sortCoachNotes = list => list.sort((a, b) => cnoteDay(b).localeCompare(cnoteDay(a)) || b.created_at.localeCompare(a.created_at));
const fmtSessionDay = d => day(d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
const CNOTE_FILTERS = [['all', 'All'], ['session', 'Sessions'], ['general', 'General']];
const CNOTES_PAGE = 3;   // notes per page
const PLANS_PAGE = 3, SNOTES_PAGE = 3;   // Training Plans and Student Notes per page, on a student's page
const cnoteIn = (n, filter) => filter === 'all' || (filter === 'session') === !!n.session_date;
const cnoteDateField = (value = '') => `<label>Session Date<span class="hint field-hint">Leave the date empty for a general note.</span>
    <input type="date" name="session_date" value="${esc(value)}" max="${localToday()}" data-high="Pick today or an earlier day."></label>`;

const coachNoteItem = n => `<div class="note-wrap" id="cnote-${n.id}"><div class="row between">
    <strong>${n.session_date ? 'Session on ' + esc(fmtSessionDay(n.session_date)) : 'General Note'}</strong>
    <div class="row"><button type="button" class="small ghost" data-act="cnote-edit" data-cnote="${n.id}">Edit</button>
    <button type="button" class="small ghost danger" data-act="cnote-delete" data-cnote="${n.id}">Delete</button></div></div>
    <p>${para(n.body)}</p>
    <div class="note-meta">${esc(n.author_name || 'Coach')} · ${fmtWhen(n.created_at)}${n.edited_at ? ' · Edited ' + fmtWhen(n.edited_at) : ''}</div></div>`;

// Days of past sessions with no note, newest first: every one newer than the newest session that has a note
// (so older, backfilled sessions stop counting once a newer one is noted). Past sessions come from historyOf:
// Session History plus an ended next session. None once coaching ends. log: session_history rows.
function cnoteMissing(notes, s, log) {
  if (s.training_ended_at) return [];
  const noted = new Set(notes.map(n => n.session_date)), days = [...new Set(historyOf(log, s).map(h => h.session_date))];
  const upTo = days.findIndex(d => noted.has(d));
  return upTo < 0 ? days : days.slice(0, upTo);
}

const CNOTE_MISSING_SHOWN = 3;   // missing sessions listed before "and n more"

// at = { filter, page, day?, allMissing? }: which notes show, which page of them (kept in range here), day, the
// missing session the coach picked to write up, and allMissing once they tapped "and n more".
function coachNotesHTML(notes, s, log, at) {
  const p = pro(s.pronouns), list = notes.filter(n => cnoteIn(n, at.filter)), [shown, page] = pageOf(list, at.page, CNOTES_PAGE);
  at.page = page;
  // Missing session notes: the card turns the warn color (renderCoachNotes) and the form starts with the picked
  // (or newest) one's date filled in. It's the field's starting value, so the card isn't marked unsaved until the
  // coach writes something.
  const missing = cnoteMissing(notes, s, log);
  const writeUp = historyOf(log, s).some(h => h.session_date === at.day) ? at.day : missing[0] || '';
  const more = at.allMissing ? 0 : Math.max(0, missing.length - CNOTE_MISSING_SHOWN);
  const pick = missing.length > 1 ? `<span class="row" style="margin-top:.5rem">${missing.slice(0, missing.length - more).map(d =>
    `<button type="button" class="small ghost" data-cnote-day="${d}">${esc(fmtSessionDay(d))}</button>`).join('')}
    ${more ? `<button type="button" class="small ghost" data-cnote-more aria-expanded="false">And ${more} More</button>`
      : at.allMissing && missing.length > CNOTE_MISSING_SHOWN ? '<button type="button" class="small ghost" data-cnote-more aria-expanded="true">Show Fewer</button>' : ''}</span>` : '';
  return `<div class="row between"><h2>Coach Notes</h2>${missing.length ? '<span class="tag warn">Needs Note</span>' : ''}</div>
    <p class="hint">Private to coaches: ${p.they} never ${p.v('see', 'sees')} these. Give a note a session date to keep what came up in that session.</p>
    ${missing.length === 1 ? `<p class="warn-box" role="status"><strong>The session on ${esc(fmtSessionDay(missing[0]))} is over.</strong>
      Note how it went while it's fresh.${writeUp === missing[0] ? ' Its date is filled in below.' : ''}</p>`
    : missing.length ? `<div class="warn-box" role="status"><strong>${missing.length} sessions have no notes yet.</strong>
      Pick one to fill in its date below, then add its note.${pick}</div>` : ''}
    <form id="cnoteForm" class="stack" data-save>
      <label>Notes<textarea name="body" rows="3" maxlength="4000" required data-need="Write notes first."></textarea></label>
      ${cnoteDateField(writeUp)}
      <button class="primary">+ Add Notes</button>
    </form>
    ${notes.length ? `<div class="seg" role="radiogroup" aria-label="Show" style="margin:1.1rem 0 .3rem">${CNOTE_FILTERS.map(([k, label]) =>
      `<label><input type="radio" name="cnote_filter" value="${k}"${k === at.filter ? ' checked' : ''}>${label} (${notes.filter(n => cnoteIn(n, k)).length})</label>`).join('')}</div>` : ''}
    ${shown.map(coachNoteItem).join('') || `<p class="muted">${notes.length ? 'None here yet.' : 'No coach notes yet.'}</p>`}
    ${pagerHTML(page, list.length, CNOTES_PAGE)}`;
}

// again: redraw after a change, without the Loading… step or a jump to the top. It can be the form
// just saved; unsaved edits in the other forms are kept (keepEdits).
async function adminStudent(id, again = false) {
  const t = ++navToken;
  const restore = again && keepEdits(again);
  if (!again) view(loading);
  const [s, coaches, notes, cnotes, log] = await Promise.all([
    sb.from('students').select('*, plans(id,title,active,start_date,updated_at), goals(*)').eq('id', id).maybeSingle().then(must),
    sb.rpc('coaches_of', { p_id: id }).then(must),
    // This student's own notes on any of their plans, newest first (like Latest Student Notes on the Students list).
    sb.from('notes').select('id,body,created_at,session:sessions!inner(title,week,plan:plans!inner(id,title,repeats,student_id))')
      .eq('from_coach', false).eq('session.plan.student_id', id).order('created_at', { ascending: false }).then(must),
    sb.from('coach_notes').select('*').eq('student_id', id).then(must),
    sb.from('session_history').select('*').eq('student_id', id).then(must),
  ]);
  if (t !== navToken) return;
  if (!s) { location.hash = '#/students'; return; }
  s.plans.sort((a, b) => (b.active - a.active) || b.updated_at.localeCompare(a.updated_at));
  sortGoals(s.goals);
  sortCoachNotes(cnotes);
  const p = pro(s.pronouns);

  // Training Plans and Student Notes, a page at a time.
  const plansHTML = page => {
    const [shown, at] = pageOf(s.plans, page, PLANS_PAGE);
    return `<ul class="list">${shown.map(p => `<li><a class="item" href="#/plan/${p.id}">
    <span><strong>${esc(p.title || 'Untitled Plan')}</strong><span class="item-sub">${p.start_date ? fmtStart(p.start_date) : 'No start date'}</span></span>
    ${p.active ? '<span class="tag ok">Current</span>' : '<span class="tag">Past</span>'}</a></li>`).join('')}</ul>${pagerHTML(at, s.plans.length, PLANS_PAGE)}`;
  };
  const snotesHTML = page => {
    const [shown, at] = pageOf(notes, page, SNOTES_PAGE);
    return shown.map(n => noteFeedItem(n)).join('') + pagerHTML(at, notes.length, SNOTES_PAGE);
  };

  view(`${crumbs([['Home', '#/'], ['Students', '#/students'], [s.name]])}
  <div class="row"><h1>${esc(s.name)}${pronounsTag(s.pronouns)}</h1>${s.training_ended_at ? '<span class="tag">Inactive</span>' : ''}</div>
  <div class="grid2 phone-order" data-folds="student">
    <div>
      <section class="card">
        <div class="row between"><h2>Training Plans</h2><button class="primary" data-act="new-plan">+ New Plan</button></div>
        <p class="hint">${p.They} ${p.v('see', 'sees')} ${p.their} current plan first, and past plans below it. Open a plan to edit it.</p>
        ${s.plans.length ? `<div id="plansBox">${plansHTML(1)}</div>` : '<p class="muted">No plans yet.</p>'}
      </section>
      <section class="card" id="goalsCard"></section>
      <section class="card feed"><h2>Student Notes</h2>
        <p class="hint">${p.Their} notes on ${p.their} sessions, newest first. Open one to reply in the plan.</p>
        ${notes.length ? `<div id="snotesBox">${snotesHTML(1)}</div>` : `<p class="muted">${p.They} ${p.v("haven't", "hasn't")} left any notes yet.</p>`}</section>
      <section class="card" id="coachNotesCard"></section>
      ${trainingCardHTML(s)}
    </div>
    <aside>
      ${sessionsCardHTML(s)}
      <section class="card" data-fold-start><h2>Details</h2>
        <p class="hint">Emails and ${p.their} page greet ${p.them} by first name. ${p.They} can change ${p.their} own pronouns too.</p>
        <form id="stuForm" class="stack" data-save>
          <label>First Name<input name="first_name" value="${esc(s.first_name)}" required data-need="Enter ${p.their} first name."></label>
          <label>Last Name<input name="last_name" value="${esc(s.last_name)}"></label>
          ${pronounsField(s.pronouns)}
          <button class="primary">Save Details</button>
        </form>
      </section>
      <section class="card" data-fold-start><h2>Coach</h2>
        <p class="hint">${me.isAdmin ? `Change it on <a href="#/user/${id}">${p.their} user page</a>.` : `An admin can change ${p.their} coach.`}</p>
        ${coachesHTML(coaches, 'No coach yet.')}</section>
      <section class="card"${s.user_id ? ' data-fold-start' : ''}><h2>Account</h2>
        ${s.user_id ? `
        <p class="hint">How ${p.they} ${p.v('sign', 'signs')} in. Send a new sign-in link if ${p.they}${p.v("'re", "'s")} locked out.</p>
        <p>Signs in as ${esc(s.email)}.</p>
        <div class="row"><button data-act="send-link">Send Sign-In Link</button>
        <button class="ghost danger" data-act="del-student">Delete Student</button></div>` : `
        <form id="inviteForm" class="stack" data-save="show">
          <p>${s.invited_at ? `Invited ${fmtWhen(s.invited_at)}, but hasn't signed in yet.` : 'Not invited yet.'}</p>
          <label>Email<input type="email" name="email" value="${esc(s.email || '')}" required data-need="Enter ${p.their} email to send the invite." autocomplete="off"></label>
          <p class="hint">${s.invited_at ? 'Fix the email here if it was wrong, then resend.' : `${p.They}'ll get an email saying ${p.their} plan is ready, with a link to choose a password.`}</p>
          <div class="row"><button class="primary" id="inviteBtn">${s.invited_at ? 'Resend Invite' : 'Send Invite'}</button>
          <button type="button" class="ghost danger" data-act="del-student">Delete Student</button></div>
          <p class="hint need" id="inviteNeed" hidden></p>
        </form>`}
      </section>
    </aside>
  </div>`, { keepScroll: again });
  bindTraining(id, s, () => adminStudent(id, true));
  if (s.plans.length) pagedBox($('#plansBox'), { page: 1 }, plansHTML);
  if (notes.length) pagedBox($('#snotesBox'), { page: 1 }, snotesHTML);
  // Session History links to Coach Notes from the same day.
  // Coach Notes redraw when the sessions change, for their prompt about the newest past session.
  const hist = { log, page: 1, notes: d => cnotes.filter(n => n.session_date === d).length, showNotes: showCoachNotes,
    addNotes: startCoachNote, changed: () => renderCoachNotes() };
  bindSessions(id, s, hist);

  $('#stuForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    busy(e.submitter, async () => {
      must(await sb.from('students').update({
        first_name: f.get('first_name').trim(), last_name: f.get('last_name').trim(), pronouns: readPronouns(f),
      }).eq('id', id));
      flash('Details saved.');
      adminStudent(id, e.target);
    });
  };

  // The invite waits for a saved plan (new plans have no title until saved) and a goal. Matches student_ready().
  const inviteNeed = () => {
    const need = [!s.plans.some(p => p.title) && 'save a training plan', !s.goals.length && 'add a goal'].filter(Boolean);
    return need.length ? `${need.join(' and ').replace(/^./, c => c.toUpperCase())} before sending the invite.` : '';
  };

  // Goals change in place, so the rest of the page (and the scroll) stays put.
  // focusAdd: a goal was just added, so the box starts empty; otherwise a goal being typed stays.
  // added: the goal just added, so its page shows. Archived stays open or shut.
  const goalAt = { current: { page: 1 }, achieved: { page: 1 }, archived: { page: 1 } };
  function renderGoals(focusAdd, added) {
    gateInvite(inviteNeed());
    const typing = !focusAdd && $('#goalForm')?.elements.body.value;
    goalAt.archivedOpen = !!$('#goalsCard details')?.open;
    if (added) goalAt.current.page = Math.floor(s.goals.filter(g => g.status === 'current').indexOf(added) / GOALS_PAGE) + 1;
    $('#goalsCard').innerHTML = coachGoalsHTML(s.goals, p, goalAt);
    $('#goalsCard').querySelectorAll('[data-goals]').forEach(box =>
      pagedBox(box, goalAt[box.dataset.goals], () => goalGroupHTML(s.goals, box.dataset.goals, goalAt)));
    const form = $('#goalForm');
    if (typing) form.elements.body.value = typing;
    if (focusAdd) form.elements.body.focus();
    form.onsubmit = e => {
      e.preventDefault();
      const body = form.elements.body.value.trim();
      if (!body) return;
      busy(e.submitter, async () => {
        const g = await sb.from('goals').insert({ student_id: id, body }).select().single().then(must);
        s.goals.push(g);
        sortGoals(s.goals);
        renderGoals(true, g);
      });
    };
  }
  const saveGoal = (b, g, patch, msg) => busy(b, async () => {
    Object.assign(g, await sb.from('goals').update(patch).eq('id', g.id).select().single().then(must));
    sortGoals(s.goals);
    renderGoals();
    if (msg) flash(msg);
  });
  renderGoals();

  // Coach Notes also change in place, and Session History redraws for its Notes counts. added: the note just
  // added, so the form starts empty and shows All, on the page with the new note; otherwise a note being typed stays.
  const cnoteAt = { filter: 'all', page: 1 };
  function renderCoachNotes(added) {
    const old = !added && $('#cnoteForm');
    // The date only if the coach changed it: a filled-in one follows the prompt.
    const date = old && old.elements.session_date, typed = old && [old.elements.body.value, date.value !== date.defaultValue && date.value];
    if (added) Object.assign(cnoteAt, { filter: 'all', spot: null, day: null, page: Math.floor(cnotes.indexOf(added) / CNOTES_PAGE) + 1 });
    const card = $('#coachNotesCard');
    card.innerHTML = coachNotesHTML(cnotes, s, log, cnoteAt);
    card.classList.toggle('overdue', cnoteMissing(cnotes, s, log).length > 0);
    bindPager(card, page => { cnoteAt.page = page; renderCoachNotes(); if (cnoteAt.spot) spotCoachNotes(); });
    // Picking a missing session: its date becomes the filled-in one (so a picked date isn't an unsaved edit).
    card.querySelectorAll('[data-cnote-day]').forEach(b => b.onclick = () => {
      const date = $('#cnoteForm').elements.session_date;
      date.value = date.defaultValue;
      cnoteAt.day = b.dataset.cnoteDay;
      renderCoachNotes();
      $('#cnoteForm').elements.body.focus();
    });
    const more = card.querySelector('[data-cnote-more]');
    // And n More shows every missing session; Show Fewer goes back to the newest few. A picked date that gets
    // hidden stays picked (it's still filled in below).
    if (more) more.onclick = () => {
      cnoteAt.allMissing = !cnoteAt.allMissing;
      renderCoachNotes();
      if (cnoteAt.allMissing) card.querySelectorAll('[data-cnote-day]')[CNOTE_MISSING_SHOWN]?.focus();   // the first one that was hidden
      else card.querySelector('[data-cnote-more]')?.focus();
    };
    hist.redraw();
    const form = $('#cnoteForm');
    if (typed) {
      form.elements.body.value = typed[0];
      if (typed[1] !== false) form.elements.session_date.value = typed[1];
    }
    form.onsubmit = e => {
      e.preventDefault();
      const f = new FormData(form), body = f.get('body').trim();
      if (!body) return;
      busy(e.submitter, async () => {
        const note = await sb.from('coach_notes').insert({ student_id: id, body, session_date: f.get('session_date') || null })
          .select().single().then(must);
        cnotes.push(note);
        sortCoachNotes(cnotes);
        renderCoachNotes(note);
        flash('Note added.');
      });
    };
    card.querySelector('.seg')?.addEventListener('change', e => { Object.assign(cnoteAt, { filter: e.target.value, page: 1, spot: null }); renderCoachNotes(); });
  }
  renderCoachNotes();
  // From Session History: the page of session notes with that day's first note, scrolled to, and every note from
  // that day lit up for a moment. If they run onto the next page, paging there lights those up too (cnoteAt.spot).
  function spotCoachNotes() {
    const els = cnotes.filter(n => n.session_date === cnoteAt.spot).map(n => $(`#cnote-${n.id}`)).filter(Boolean);
    els.forEach(el => el.classList.remove('spot'));
    if (els.length) void els[0].offsetWidth;   // restart the animation
    els.forEach(el => el.classList.add('spot'));
    return els;
  }
  // From Session History's Add Notes: that day becomes the filled-in Session Date (like picking a missing session),
  // then the form is scrolled to with the Notes box focused. Notes already typed stay.
  function startCoachNote(date) {
    const field = $('#cnoteForm').elements.session_date;
    field.value = field.defaultValue;
    cnoteAt.day = date;
    renderCoachNotes();
    const card = $('#coachNotesCard');
    if (card.classList.contains('folded')) setFold(card, false);
    const form = $('#cnoteForm');
    form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    form.elements.body.focus({ preventScroll: true });
  }
  function showCoachNotes(date) {
    const list = cnotes.filter(n => cnoteIn(n, 'session')), i = list.findIndex(n => n.session_date === date);
    if (i < 0) return;
    Object.assign(cnoteAt, { filter: 'session', page: Math.floor(i / CNOTES_PAGE) + 1, spot: date });
    renderCoachNotes();
    const card = $('#coachNotesCard');
    if (card.classList.contains('folded')) setFold(card, false);
    const els = spotCoachNotes();
    els[0].scrollIntoView({ behavior: 'smooth', block: els.length > 1 ? 'start' : 'center' });
  }
  if (restore) restore();

  const inviteForm = $('#inviteForm');
  if (inviteForm) inviteForm.onsubmit = e => {
    e.preventDefault();
    if (inviteNeed()) return;
    const email = new FormData(e.target).get('email').trim().toLowerCase();
    busy(e.submitter, async () => {
      // Save the email first: the sign-up gate only lets listed emails create an account.
      if (email !== s.email) {
        const { error } = await sb.from('students').update({ email }).eq('id', id);
        if (error) throw error.code === '23505' ? new Error('Another student already has that email.') : error;
      }
      const { error } = await sendLink(email, s.first_name);
      if (error) throw error;
      must(await sb.from('students').update({ invited_at: new Date().toISOString() }).eq('id', id));
      flash(`Invite sent to ${email}.`);
      adminStudent(id, e.target);
    });
  };

  app.onclick = async e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act, g = s.goals.find(x => x.id === b.dataset.goal), cn = cnotes.find(x => x.id === b.dataset.cnote);
    if (cn) {
      if (act === 'cnote-edit') {
        const f = await ask({ title: 'Edit Notes', ok: 'Save Notes', body: `<div class="stack">
          <label>Notes<textarea name="body" rows="6" maxlength="4000" required data-need="Write notes.">${esc(cn.body)}</textarea></label>
          ${cnoteDateField(cn.session_date || '')}</div>` });
        const body = f?.get('body').trim();
        if (body) busy(b, async () => {
          Object.assign(cn, await sb.from('coach_notes').update({ body, session_date: f.get('session_date') || null })
            .eq('id', cn.id).select().single().then(must));
          sortCoachNotes(cnotes);
          renderCoachNotes();
          flash('Note saved.');
        });
      } else if (act === 'cnote-delete') {
        if (await ask({ title: 'Delete This Note?', body: "<p>This can't be undone.</p>", ok: 'Delete', warn: true }))
          busy(b, async () => {
            must(await sb.from('coach_notes').delete().eq('id', cn.id));
            cnotes.splice(cnotes.indexOf(cn), 1);
            renderCoachNotes();
            flash('Note deleted.');
          });
      }
      return;
    }
    if (g) {
      if (act === 'goal-edit') {
        const f = await ask({ title: 'Edit Goal', ok: 'Save Goal',
          body: `<label>Goal<textarea name="body" rows="3" maxlength="500" required data-need="Write the goal.">${esc(g.body)}</textarea></label>` });
        const body = f?.get('body').trim();
        if (body) saveGoal(b, g, { body });
      } else if (act === 'goal-delete') {
        if (await ask({ title: 'Delete This Goal?', body: "<p>This can't be undone. To just hide it, keep it archived.</p>", ok: 'Delete', warn: true }))
          busy(b, async () => {
            must(await sb.from('goals').delete().eq('id', g.id));
            s.goals = s.goals.filter(x => x !== g);
            renderGoals();
          });
      } else {
        const status = { 'goal-achieved': 'achieved', 'goal-archive': 'archived', 'goal-current': 'current' }[act];
        saveGoal(b, g, { status, done_at: status === 'current' ? null : new Date().toISOString() },
          { achieved: 'Goal marked achieved.', archived: 'Goal archived.', current: 'Goal is current again.' }[status]);
      }
      return;
    }
    // Ask before making the plan, so cancelling doesn't leave an empty one behind.
    if (b.dataset.act === 'new-plan' && await okToLeave()) busy(b, async () => {
      const p = await sb.from('plans').insert({ student_id: id, title: '', active: !s.plans.some(x => x.active) })
        .select('id').single().then(must);
      goTo('#/plan/' + p.id);
    });
    if (b.dataset.act === 'send-link') busy(b, async () => {
      const { error } = await sendLink(s.email);
      if (error) throw error;
      flash(`Link sent to ${s.email}.`);
    });
    if (b.dataset.act === 'del-student') {
      const n = s.plans.length;
      const ok = await ask({ title: `Delete ${s.name}?`, warn: true, ok: 'Delete Student',
        body: `<p>This deletes ${n ? `${p.their} ${n} plan${n > 1 ? 's' : ''}, all notes` : `${p.them} from your list`}
        and ${p.their} login. This can't be undone.</p>` });
      if (ok) busy(b, async () => {
        must(await sb.rpc('delete_student', { p_id: id }));
        flash(`${s.name} deleted.`);
        goTo('#/students');
      });
    }
  };
}

        <p class="hint">Picking an exercise in a training plan fills in these values. Changing them in a plan doesn't change this list.
          New exercises typed into a plan are added here when the plan is saved.</p>
        <form id="exAdd" class="stack" data-save>${exFieldsHTML()}<button class="primary">+ Add Exercise</button></form>
      </section>
    </aside>
  </div>`);

  const search = $('#exSearch');
  function renderList() {
    const q = exKey(search.value);
    const shown = list.filter(x => !q || x.name_key.includes(q));
    $('#exHead').hidden = !shown.length;
    $('#exList').innerHTML = shown.map(x => {
      const sub = EX_FIELDS.slice(0, 3).filter(([f]) => x[f]).map(([f, l]) => `${l}: ${esc(x[f])}`).join(' · ');
      return `<li class="goal"><div class="goal-text"><strong>${esc(x.name)}</strong>
        ${sub ? `<span class="item-sub">${sub}</span>` : ''}${x.notes ? `<span class="item-sub">Notes: ${para(x.notes)}</span>` : ''}</div>
        <div class="row ex-actions"><button type="button" class="small ghost" data-act="ex-edit" data-ex="${x.id}">Edit</button>
        <button type="button" class="small ghost danger" data-act="ex-delete" data-ex="${x.id}">Delete</button></div></li>`;
    }).join('') || `<li><p class="muted" style="margin:.6rem 0">${list.length ? 'No exercise matches that search.' : 'No exercises yet. Add your first one.'}</p></li>`;
  }
  const sortList = () => list.sort((a, b) => a.name_key.localeCompare(b.name_key));
  renderList();
  search.oninput = renderList;

  $('#exAdd').onsubmit = e => {
    e.preventDefault();
    const row = exFromForm(new FormData(e.target));
    busy(e.submitter, async () => {
      const { data, error } = await sb.from('exercises').insert(row).select().single();
      if (error) throw exDupError(error);
      list.push(data); sortList();
      e.target.reset();
      search.value = '';
      renderList();
      e.target.elements.name.focus();
      flash(`${data.name} added.`);
    });
  };

  app.onclick = async e => {
    const b = e.target.closest('[data-act]');
    const x = b && list.find(y => y.id === b.dataset.ex);
    if (!x) return;
    if (b.dataset.act === 'ex-edit') {
      const f = await ask({ title: 'Edit Exercise', ok: 'Save Exercise', body: `<div class="stack">${exFieldsHTML(x)}</div>
        <p class="hint">Plans that already use it keep their own values.</p>` });
      if (f) busy(b, async () => {
        const { data, error } = await sb.from('exercises').update(exFromForm(f)).eq('id', x.id).select().single();
        if (error) throw exDupError(error);
        Object.assign(x, data); sortList();
        renderList();
        flash('Exercise saved.');
      });
    }
    if (b.dataset.act === 'ex-delete' && await ask({ title: `Delete ${x.name}?`, warn: true, ok: 'Delete',
      body: '<p>It comes off the list. Plans that already use it keep it.</p>' }))
      busy(b, async () => {
        must(await sb.from('exercises').delete().eq('id', x.id));
        list = list.filter(y => y !== x);
        renderList();
      });
  };
}

// Adds a plan's exercises that aren't on the master list yet, with the plan's values.
// Existing names are left alone (ignoreDuplicates), so plan edits never change the list.
async function addToMasterList(rows) {
  const known = new Set(draft.library.map(x => x.name_key)), add = new Map();
  for (const x of rows.flatMap(r => r.exercises)) {
    const k = exKey(x.name);
    if (k && !known.has(k) && !add.has(k))
      add.set(k, { name: x.name.trim().slice(0, 200), ...Object.fromEntries(EX_FIELDS.map(([f]) => [f, String(x[f] ?? '').trim()])) });
  }
  if (!add.size) return 0;
  const added = await sb.from('exercises').upsert([...add.values()], { onConflict: 'name_key', ignoreDuplicates: true })
    .select().then(must);
  draft.library.push(...added);
  return added.length;
}

// The exercise name picker: one menu under whichever name field has focus, listing master
// exercises that contain what's typed (names starting with it first). Picking one sets the
// field and fires an input event, so the editor's oninput fills in the values as for typing.
const exMenu = Object.assign(document.createElement('ul'), { id: 'exMenu', className: 'combo-menu', role: 'listbox', hidden: true });
exMenu.setAttribute('aria-label', 'Exercises');
document.body.append(exMenu);
let exMenuFor = null, exMatches = [], exActive = -1;

function exMenuOpen(input) {
  const q = exKey(input.value);
  exMatches = (draft?.library ?? []).filter(x => x.name_key.includes(q))
    .sort((a, b) => (b.name_key.startsWith(q) - a.name_key.startsWith(q)) || a.name_key.localeCompare(b.name_key));
  if (!exMatches.length || (exMatches.length === 1 && exMatches[0].name_key === q)) return exMenuClose();
  exMenuFor = input; exActive = -1;
  const hit = s => { const i = s.toLowerCase().indexOf(q);
    return q && i >= 0 ? `${esc(s.slice(0, i))}<mark>${esc(s.slice(i, i + q.length))}</mark>${esc(s.slice(i + q.length))}` : esc(s); };
  exMenu.innerHTML = exMatches.map((x, k) => {
    const sum = [x.sets && x.reps ? `${x.sets} × ${x.reps}` : x.sets || x.reps, x.rest].filter(Boolean).join(' · ');
    return `<li id="exOpt${k}" role="option" data-k="${k}"><span>${hit(x.name)}</span>${sum ? `<span class="muted">${esc(sum)}</span>` : ''}</li>`;
  }).join('');
  const r = input.getBoundingClientRect();
  const vw = document.documentElement.clientWidth, w = Math.min(Math.max(r.width, 320), vw - 16);
  Object.assign(exMenu.style, { left: Math.max(8, Math.min(r.left, vw - w - 8)) + scrollX + 'px', top: r.bottom + scrollY + 4 + 'px', width: w + 'px' });
  exMenu.hidden = false; exMenu.scrollTop = 0;
  input.setAttribute('aria-expanded', 'true');
  input.removeAttribute('aria-activedescendant');
}

function exMenuClose() {
  exMenu.hidden = true;
  exMenuFor?.setAttribute('aria-expanded', 'false');
  exMenuFor?.removeAttribute('aria-activedescendant');
  exMenuFor = null;
}

function exMenuMove(k) {
  exActive = (k + exMatches.length) % exMatches.length;
  exMenu.querySelectorAll('li').forEach((li, j) => li.setAttribute('aria-selected', j === exActive));
  const li = exMenu.children[exActive];
  li.scrollIntoView({ block: 'nearest' });
  exMenuFor.setAttribute('aria-activedescendant', li.id);
}

function exMenuPick(k) {
  const input = exMenuFor;
  input.value = exMatches[k].name;
  exMenuClose();
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

document.addEventListener('focusin', e => { if (e.target.matches?.('[data-combo]')) exMenuOpen(e.target); });
document.addEventListener('focusout', e => { if (e.target === exMenuFor) exMenuClose(); });
document.addEventListener('input', e => { if (e.target.matches?.('[data-combo]') && e.isTrusted) exMenuOpen(e.target); });
document.addEventListener('keydown', e => {
  if (!e.target.matches?.('[data-combo]')) return;
  if (e.target !== exMenuFor) { if (e.key === 'ArrowDown') { exMenuOpen(e.target); e.preventDefault(); } return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { exMenuMove(exActive + (e.key === 'ArrowDown' ? 1 : -1)); e.preventDefault(); }
  else if (e.key === 'Enter' && exActive >= 0) { exMenuPick(exActive); e.preventDefault(); }
  else if (e.key === 'Escape') { exMenuClose(); e.preventDefault(); }
  else if (e.key === 'Tab') exMenuClose();
});
exMenu.addEventListener('mousedown', e => e.preventDefault());   // keep focus in the field
exMenu.addEventListener('click', e => { const li = e.target.closest('li'); if (li) exMenuPick(+li.dataset.k); });
addEventListener('resize', () => exMenuFor && exMenuOpen(exMenuFor));

// ---------- Coach: plan editor ----------

const blankEx = () => ({ name: '', sets: '', reps: '', rest: '', notes: '' });
const blankSession = week => ({ id: crypto.randomUUID(), week, title: '', details: '', exercises: [blankEx()] });

async function adminPlan(id) {
  const t = ++navToken;
  view(loading);
  const [plan, sessions, library] = await Promise.all([
    sb.from('plans').select('*, student:students(id,name,pronouns)').eq('id', id).maybeSingle().then(must),
    sb.from('sessions').select('*').eq('plan_id', id).order('week').order('position').then(must),
    sb.from('exercises').select('*').then(must),
  ]);
  if (t !== navToken) return;
  if (!plan) { location.hash = '#/'; return; }
  const notes = sessions.length
    ? await sb.from('notes').select('*').in('session_id', sessions.map(s => s.id)).order('created_at').then(must) : [];
  if (t !== navToken) return;

  // library: the master exercise list, for the Exercise picker.
  draft = { plan, sessions, library, savedIds: new Set(sessions.map(s => s.id)), preview: false };
  notesCtx = { notes, studentName: plan.student.name };
  dirty = false;
  renderEditor();
  window.scrollTo(0, 0);
}

function displayOrder() {
  const S = draft.sessions;
  return S.map((_, i) => i).sort((a, b) => (S[a].week - S[b].week) || (a - b));
}

function byWeek(list) {
  const weeks = new Map();
  for (const x of list) {
    if (!weeks.has(x.week)) weeks.set(x.week, []);
    weeks.get(x.week).push(x);
  }
  return [...weeks];
}

function markDirty() {
  dirty = true;
  const el = $('#saveState');
  if (el) { el.textContent = 'Unsaved changes'; el.classList.add('warn'); el.parentElement.classList.add('unsaved'); }
}

function sessionEditHTML(s, i) {
  const f = (field, ph, e) => `<input data-s="${i}"${e != null ? ` data-e="${e}"` : ''} data-f="${field}" placeholder="${ph}" aria-label="${ph}"
    ${field === 'name' && e != null ? 'data-combo role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="exMenu" maxlength="200" autocomplete="off"' : ''}
    value="${esc(e != null ? s.exercises[e][field] : s[field])}">`;
  return `<article class="card session-edit">
    <div class="row">
      ${draft.plan.repeats ? '' : `<label class="wk">Week<input type="number" min="1" data-s="${i}" data-f="week" value="${s.week}"></label>`}
      <label class="grow">Session<input data-s="${i}" data-f="title" value="${esc(s.title)}" placeholder="e.g. Limit bouldering"></label>
    </div>
    <label style="margin-top:.6rem">Details<textarea data-s="${i}" data-f="details" rows="2"
      placeholder="Warm-up, focus, how hard to go…">${esc(s.details)}</textarea></label>
    ${s.exercises.length ? '<div class="ex-head"><span>Exercise</span><span>Sets</span><span>Reps / Time</span><span>Rest</span><span>Notes</span><span></span></div>' : ''}
    ${s.exercises.map((_, e) => `<div class="ex-row">${f('name', 'Exercise', e)}${f('sets', 'Sets', e)}${f('reps', 'Reps / Time', e)}${f('rest', 'Rest', e)}${f('notes', 'Notes', e)}
      <button class="icon ghost" data-act="del-ex" data-s="${i}" data-e="${e}" title="Remove exercise" aria-label="Remove exercise">×</button></div>`).join('')}
    <div class="row between" style="margin-top:.7rem">
      <button class="ghost small" data-act="add-ex" data-s="${i}">+ Add Exercise</button>
      <div class="row">
        <button class="icon ghost" data-act="up" data-s="${i}" title="Move up" aria-label="Move up">↑</button>
        <button class="icon ghost" data-act="down" data-s="${i}" title="Move down" aria-label="Move down">↓</button>
        <button class="ghost small" data-act="dup" data-s="${i}">Duplicate</button>
        <button class="ghost small danger" data-act="del-session" data-s="${i}">Remove</button>
      </div>
    </div>
    ${draft.savedIds.has(s.id) ? notesHTML(s.id) : ''}
  </article>`;
}

function renderEditor() {
  const p = draft.plan;
  const order = displayOrder();
  let body;
  if (draft.preview) {
    body = planReadHTML(p, order.map(i => draft.sessions[i]), { notes: false });
  } else {
    const weeks = byWeek(order.map(i => ({ week: draft.sessions[i].week, i })));
    const sessionsHTML = p.repeats ? `<section class="week">
      <h2>Every Week <span class="muted">Repeat these sessions each week</span></h2>
      ${weeks.length ? '' : '<p class="muted">No sessions yet. Add the first one below.</p>'}
      ${order.map(i => sessionEditHTML(draft.sessions[i], i)).join('')}
      <button class="ghost" style="margin-top:.8rem" data-act="add-session" data-week="1" data-first data-need="Add at least one session.">+ Add Session</button>
    </section>` : `
    ${weeks.length ? '' : '<p class="muted" style="margin-top:1rem">No sessions yet. Add the first week below.</p>'}
    ${weeks.map(([w, list]) => `<section class="week">
      <h2>Week ${w} <span class="muted">${weekRange(p.start_date, w)}</span></h2>
      ${list.map(({ i }) => sessionEditHTML(draft.sessions[i], i)).join('')}
      <button class="ghost" style="margin-top:.8rem" data-act="add-session" data-week="${w}">+ Add Session to Week ${w}</button>
    </section>`).join('')}
    <div class="row" style="margin-top:1.4rem"><button data-act="add-week" data-first data-need="Add at least one week with a session.">+ Add Week</button></div>`;
    body = `<section class="card stack">
      <div class="stack" style="gap:.3rem"><div class="seg" role="radiogroup" aria-label="Plan Layout">
        <label><input type="radio" name="layout" data-p="repeats" value="1" ${p.repeats ? 'checked' : ''}>Repeat Weekly</label>
        <label><input type="radio" name="layout" data-p="repeats" value="0" ${p.repeats ? '' : 'checked'}>Week by Week</label>
      </div>
      <p class="hint" style="margin:0">${p.repeats ? 'One week of sessions the student repeats every week.' : 'A different set of sessions for each week, with dates from the start date.'}</p></div>
      <label>Plan Title<input data-p="title" value="${esc(p.title)}" placeholder="Training Plan" required data-need="Give the plan a title."></label>
      <div class="row">
        <div><label>Start Date<input type="date" data-p="start_date" value="${esc(p.start_date || '')}" required data-need="Pick the day the plan starts."></label></div>
        <label class="check" style="margin-top:1.2rem"><input type="checkbox" data-p="active" ${p.active ? 'checked' : ''}> Current Plan (shown first to the student; replaces ${pro(p.student.pronouns).their} other current plan)</label>
      </div>
      <label>Overview<textarea data-p="overview" rows="3" placeholder="What this plan is for, how to warm up, what to track…">${esc(p.overview)}</textarea></label>
    </section>
    ${sessionsHTML}
    <div class="danger-zone"><button class="ghost small danger" data-act="del-plan">Delete Plan</button></div>`;
  }

  view(`${crumbs([['Home', '#/'], ['Students', '#/students'], [p.student.name, '#/student/' + p.student.id], [p.title || 'Untitled Plan']])}
    <div class="card savebar${dirty ? ' unsaved' : ''}">
      <span id="saveState" class="${dirty ? 'warn' : 'muted'}">${dirty ? 'Unsaved changes' : 'All changes saved'}</span>
      <div class="row"><button data-act="preview">${draft.preview ? 'Back to Editing' : 'Student View'}</button>
      <button class="primary" data-act="save">Save Plan</button></div>
    </div>
    ${body}`, { keepScroll: true });

  app.oninput = e => {
    const t = e.target, d = t.dataset;
    if (d.p && t.type !== 'checkbox' && t.type !== 'radio') draft.plan[d.p] = t.value;
    else if (d.s != null && d.f !== 'week') {
      const s = draft.sessions[+d.s];
      if (d.e == null) s[d.f] = t.value;
      else if (d.f === 'name') setExName(s.exercises[+d.e], t);
      else s.exercises[+d.e][d.f] = t.value;
    } else return;
    markDirty();
  };
  app.onchange = e => {
    const t = e.target, d = t.dataset;
    if (d.p === 'repeats') return setRepeats(t.value === '1');
    if (d.p === 'active') { draft.plan.active = t.checked; markDirty(); }
    if (d.p === 'start_date') renderEditor();          // week date ranges
    if (d.f === 'week') {
      const [s] = draft.sessions.splice(+d.s, 1);      // goes to the end of its new week
      s.week = Math.max(1, parseInt(t.value, 10) || 1);
      draft.sessions.push(s);
      markDirty(); renderEditor();
    }
  };
  app.onclick = async e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const S = draft.sessions, i = +b.dataset.s;
    switch (b.dataset.act) {
      case 'add-ex': S[i].exercises.push(blankEx()); break;
      case 'del-ex': S[i].exercises.splice(+b.dataset.e, 1); break;
      case 'add-session': S.push(blankSession(+b.dataset.week)); break;
      case 'add-week': S.push(blankSession(Math.max(0, ...S.map(s => s.week)) + 1)); break;
      case 'dup': S.splice(i + 1, 0, { ...structuredClone(S[i]), id: crypto.randomUUID() }); break;
      case 'del-session': {
        const n = notesCtx.notes.filter(x => x.session_id === S[i].id).length;
        const lastInWeek = !draft.plan.repeats && !S.some((x, k) => k !== i && x.week === S[i].week);
        const name = S[i].title.trim() ? `“${esc(S[i].title.trim())}”` : 'This session';
        if (!await ask({ title: lastInWeek ? `Remove Week ${S[i].week}?` : 'Remove This Session?', warn: true, ok: 'Remove',
          body: `<p>${lastInWeek ? `${name} is the only session in week ${S[i].week}, so the week will go too.` : `${name} will be removed${draft.plan.repeats ? '' : ` from week ${S[i].week}`}.`}</p>
            ${n ? `<p>It has ${n} note${n > 1 ? 's' : ''}, which will be deleted when you save the plan.</p>` : ''}` })) return;
        S.splice(i, 1); break;
      }
      case 'up': case 'down': {
        const order = displayOrder(), j = order[order.indexOf(i) + (b.dataset.act === 'up' ? -1 : 1)];
        if (j == null || S[j].week !== S[i].week) return;
        [S[i], S[j]] = [S[j], S[i]]; break;
      }
      case 'preview': draft.preview = !draft.preview; renderEditor(); window.scrollTo(0, 0); return;
      case 'save': return savePlan(b);
      case 'del-plan': return deletePlan(b);
      default: return;
    }
    markDirty();
    renderEditor();
  };
}

// Repeat Weekly keeps one week: the first week's sessions become week 1, and any later
// weeks are removed from the draft (for good once the plan is saved).
async function setRepeats(on) {
  const S = draft.sessions;
  if (on) {
    const first = Math.min(...S.map(s => s.week));
    const later = S.filter(s => s.week !== first);
    if (later.length) {
      const weeks = new Set(later.map(s => s.week)).size;
      const n = notesCtx.notes.filter(x => later.some(s => s.id === x.session_id)).length;
      if (!await ask({ title: 'Switch to Repeat Weekly?', warn: true, ok: 'Switch',
        body: `<p>Repeat Weekly keeps only one week. Week ${first} stays, and ${weeks === 1 ? 'the other week' : `the other ${weeks} weeks`}
          (${later.length} session${later.length > 1 ? 's' : ''}) will be removed.</p>
          ${n ? `<p>${n === 1 ? 'One note' : `${n} notes`} on those sessions will be deleted when you save the plan.</p>` : ''}` })) {
        renderEditor(); return;
      }
      draft.sessions = S.filter(s => s.week === first);
    }
    draft.sessions.forEach(s => { s.week = 1; });
  }
  draft.plan.repeats = on;
  markDirty();
  renderEditor();
}

// Which master exercise each plan exercise's values came from (by name_key). An exercise
// starts as its own name's, so fixing a typo or retyping the name keeps the coach's values.
const filledFrom = new WeakMap();

// Typing or picking a master exercise's name fills in its values; the coach can change them after.
function setExName(x, input) {
  if (!filledFrom.has(x)) filledFrom.set(x, exKey(x.name));
  x.name = input.value;
  const m = draft.library.find(y => y.name_key === exKey(x.name));
  if (!m || filledFrom.get(x) === m.name_key) return;
  filledFrom.set(x, m.name_key);
  const row = input.closest('.ex-row');
  for (const [f] of EX_FIELDS) row.querySelector(`[data-f="${f}"]`).value = x[f] = m[f];
}

function sessionRows(planId) {
  return displayOrder().map((i, position) => {
    const s = draft.sessions[i];
    return {
      id: s.id, plan_id: planId, week: s.week, position,
      title: s.title.trim(), details: s.details.trim(),
      exercises: s.exercises.filter(x => Object.values(x).some(v => String(v).trim())),
    };
  });
}

function savePlan(btn) {
  const p = draft.plan;
  const missing = [!p.title.trim() && '[data-p="title"]', !p.start_date && '[data-p="start_date"]',
    !draft.sessions.length && '[data-first]'].filter(Boolean);
  if (missing.length) {
    if (draft.preview) { draft.preview = false; renderEditor(); }
    const els = missing.map(sel => $(sel));
    els.forEach(el => fieldError(el, el.dataset.need));
    els[0].focus();
    return;
  }
  return busy(btn, async () => {
    const rows = sessionRows(p.id);
    // The database turns the student's other current plan into a past plan; name it in the message.
    const closed = p.active ? await sb.from('plans').select('title')
      .eq('student_id', p.student.id).eq('active', true).neq('id', p.id).then(must) : [];
    must(await sb.from('plans').update({
      title: p.title.trim(), overview: p.overview.trim(), start_date: p.start_date || null,
      repeats: p.repeats, active: p.active, updated_at: new Date().toISOString(),
    }).eq('id', p.id));
    if (rows.length) must(await sb.from('sessions').upsert(rows));
    const gone = [...draft.savedIds].filter(id => !rows.some(r => r.id === id));
    if (gone.length) must(await sb.from('sessions').delete().in('id', gone));
    draft.sessions = rows;
    draft.savedIds = new Set(rows.map(r => r.id));
    notesCtx.notes = notesCtx.notes.filter(n => draft.savedIds.has(n.session_id));
    dirty = false;
    renderEditor();
    const msg = closed.length ? `Plan saved. “${closed[0].title}” is now a past plan.` : 'Plan saved.';
    // The plan is saved even if this fails; the next save tries again.
    const added = await addToMasterList(rows).catch(e => { flash(`${msg} Couldn't add new exercises to the master list: ${msgOf(e)}`, 'error'); });
    if (added != null) flash(added ? `${msg} ${added === 1 ? '1 new exercise' : `${added} new exercises`} added to the master list.` : msg);
  });
}

async function deletePlan(btn) {
  const p = draft.plan;
  if (!await ask({ title: 'Delete This Plan?', warn: true, ok: 'Delete Plan',
    body: `<p>“${esc(p.title || 'Untitled Plan')}” and all its notes will be deleted for good.</p>` })) return;
  busy(btn, async () => {
    must(await sb.from('plans').delete().eq('id', p.id));
    flash('Plan deleted.');
    goTo('#/student/' + p.student.id);
  });
}

// ---------- Plans as the student sees them ----------

function planReadHTML(plan, sessions, { notes = true } = {}) {
  const weeks = byWeek(sessions);
  return `<header class="plan-head">
      <div class="row"><h1>${esc(plan.title || 'Untitled Plan')}</h1>${plan.active ? '' : '<span class="tag">Past Plan</span>'}</div>
      ${plan.start_date ? `<p class="muted">${fmtStart(plan.start_date)}</p>` : ''}
      ${plan.overview ? `<div class="card prose">${para(plan.overview)}</div>` : ''}
    </header>
    ${!weeks.length ? '<p class="muted">No sessions in this plan yet.</p>'
    : plan.repeats ? `<section class="week">
      <h2>Every Week <span class="muted">Repeat these sessions each week</span></h2>
      ${sessions.map(s => sessionReadHTML(s, notes)).join('')}</section>`
    : weeks.map(([w, list]) => `<section class="week">
      <h2>Week ${w} <span class="muted">${weekRange(plan.start_date, w)}</span></h2>
      ${list.map(s => sessionReadHTML(s, notes)).join('')}</section>`).join('')}`;
}

function sessionReadHTML(s, withNotes) {
  const ex = (s.exercises || []).filter(x => Object.values(x).some(v => String(v).trim()));
  return `<article class="card session">
    <h3>${esc(s.title || 'Session')}</h3>
    ${s.details ? `<p class="prose">${para(s.details)}</p>` : ''}
    ${ex.length ? `<table class="ex"><thead><tr><th>Exercise</th><th>Sets</th><th>Reps / Time</th><th>Rest</th><th>Notes</th></tr></thead>
      <tbody>${ex.map(x => `<tr><td>${esc(x.name)}</td><td data-l="Sets">${esc(x.sets)}</td><td data-l="Reps / Time">${esc(x.reps)}</td>
      <td data-l="Rest">${esc(x.rest)}</td><td data-l="Notes">${esc(x.notes)}</td></tr>`).join('')}</tbody></table>` : ''}
    ${withNotes ? notesHTML(s.id) : ''}
  </article>`;
}

async function studentHome() {
  const t = ++navToken;
  view(loading);
  const [plans, goals, coaches, next, log] = await Promise.all([
    sb.from('plans').select('id,title,active,start_date')
      .order('active', { ascending: false }).order('created_at', { ascending: false }).then(must),
    sb.from('goals').select('*').then(must).then(sortGoals),   // RLS leaves out archived goals
    sb.rpc('coaches_of', { p_id: me.student.id }).then(must),
    sb.from('students').select(NEXT_COLS).eq('id', me.student.id).maybeSingle().then(must),
    sb.from('session_history').select('*').eq('student_id', me.student.id).then(must),
  ]);
  if (t !== navToken) return;
  const current = plans.find(p => p.active);   // at most one (one_current_plan)
  const history = studentHistory(log, next);
  if (current) return studentPlan(current.id, plans, goals, coaches, next, history);

  // No current plan, so any plans here are past ones.
  view(`<h1>${welcome()}</h1>${nextSessionAlert(next)}${goalHTML(goals)}
    ${plans.length ? `<section class="card"><h2>Past Plans</h2>
      <p class="hint">Your past plans, kept so you can look back.</p><ul class="list">${planLinks(plans)}</ul></section>`
      : "<section class=\"card\"><p>Your coach hasn't shared a plan with you yet. Check back soon.</p></section>"}
    ${achievedHTML(goals)}${history.html}${yourCoachHTML(coaches)}${myDetailsHTML()}`);
  history.bind();
  bindMyDetails();
}

// Students change only their own pronouns (update_my_pronouns() in schema.sql), at the bottom of their home page.
// Their name stays the coach's to change, so the coach always knows who they are.
const myDetailsHTML = () => `<section class="card" id="myDetails" style="margin-top:2rem"><h2>Your Pronouns</h2>
  <p class="hint">Your coach sees these next to your name. To change your name, ask your coach.</p>
  <form id="myForm" class="stack" data-save>
    ${pronounsField(me.student.pronouns, 'Your')}
    <button class="primary">Save Pronouns</button>
  </form></section>`;
function bindMyDetails() {
  $('#myForm').onsubmit = e => {
    e.preventDefault();
    busy(e.submitter, async () => {
      must(await sb.rpc('update_my_pronouns', { p_pronouns: readPronouns(new FormData(e.target)) }));
      await loadMe(me.user);
      $('#myDetails').outerHTML = myDetailsHTML();
      bindMyDetails();
      flash('Pronouns saved.');
    });
  };
}

function goalHTML(goals) {
  const cur = goals.filter(g => g.status === 'current');
  if (!cur.length) return '';
  if (cur.length === 1) return `<p class="alert"><strong>Your goal:</strong> ${esc(cur[0].body)}</p>`;
  return `<div class="alert"><strong>Your goals:</strong><ul>${cur.map(g => `<li>${esc(g.body)}</li>`).join('')}</ul></div>`;
}
function achievedHTML(goals) {
  const won = goals.filter(g => g.status === 'achieved');
  return won.length ? `<section class="card" style="margin-top:2rem"><h2>Goals Achieved</h2>
    <p class="hint">Every goal you've sent so far! This is what all the training is for, so be proud of yourself and climb on!</p><ul class="list">${won.map(g =>
    goalItem(g, fmtDay(g.done_at), '<span class="tag ok">Achieved</span>')).join('')}</ul></section>` : '';
}
// Hidden until they have had a coach.
const yourCoachHTML = coaches => coaches.length ? `<section class="card" style="margin-top:2rem"><h2>Your Coach</h2>
  <p class="hint">Your current coach, and any past coaches.</p>
  ${coachesHTML(coaches, "You don't have a coach right now.")}</section>` : '';
const planLinks = plans => plans.map(p => `<li><a class="item" href="#/plan/${p.id}"><strong>${esc(p.title || 'Untitled Plan')}</strong>
  ${p.active ? '<span class="tag ok">Current</span>' : '<span class="tag">Past</span>'}</a></li>`).join('');

async function studentPlan(id, allPlans, goals, coaches, next, history) {
  const t = ++navToken;
  view(loading);
  const [plan, sessions] = await Promise.all([
    sb.from('plans').select('*').eq('id', id).maybeSingle().then(must),
    sb.from('sessions').select('*').eq('plan_id', id).order('week').order('position').then(must),
  ]);
  if (t !== navToken) return;
  if (!plan) { view(`<section class="card narrow"><h1>Plan Not Found</h1><p><a href="#/">Back to your plans</a></p></section>`); return; }
  const notes = sessions.length
    ? await sb.from('notes').select('*').in('session_id', sessions.map(s => s.id)).order('created_at').then(must) : [];
  if (t !== navToken) return;
  notesCtx = { notes, studentName: me.student.name };
  const others = allPlans?.filter(p => p.id !== id) || [];
  view(`${allPlans ? `<h1>${welcome()}</h1>` : crumbs([['Home', '#/'], [plan.title || 'Untitled Plan']])}
    ${nextSessionAlert(next)}
    ${goals ? goalHTML(goals) : ''}
    ${allPlans && plan.active ? '<h2 class="section-label">Current Plan</h2>' : ''}
    ${planReadHTML(plan, sessions)}
    ${others.length ? `<section class="card" style="margin-top:2rem"><h2>Past Plans</h2>
      <p class="hint">Your past plans, kept so you can look back.</p><ul class="list">${planLinks(others)}</ul></section>` : ''}
    ${goals ? achievedHTML(goals) : ''}
    ${history ? history.html : ''}
    ${coaches ? yourCoachHTML(coaches) : ''}
    ${allPlans ? myDetailsHTML() : ''}`);
  history?.bind();
  if (allPlans) bindMyDetails();
}

// ---------- Notes (shared by the student's view and the coach's editor) ----------

function notesHTML(sid) {
  const list = notesCtx.notes.filter(n => n.session_id === sid);
  const canDelete = n => me.isCoach || (n.author_id === me.user.id && !n.from_coach);
  return `<details class="notes" data-notes="${sid}" ${list.length ? 'open' : ''}>
    <summary>${list.length ? `Notes (${list.length})` : 'Add a Note'}</summary>
    ${list.map(n => `<div class="note${n.author_id === me.user.id ? ' mine' : ''}">
      <div class="note-meta"><strong>${n.from_coach ? esc(n.author_name || 'Coach') : esc(notesCtx.studentName)}</strong> · ${fmtWhen(n.created_at)}
      ${canDelete(n) ? ` · <button type="button" class="link" data-del-note="${n.id}">Delete</button>` : ''}</div>
      <p>${para(n.body)}</p></div>`).join('')}
    <form class="note-form" data-note-form="${sid}">
      <textarea name="body" rows="2" maxlength="4000" required data-need="Write your note first."
        placeholder="${me.isCoach ? 'Reply to your student…'
          : list.some(n => !n.from_coach) ? 'Any other thoughts?' : 'How did the session go? Any questions?'}"></textarea>
      <button class="small">+ Post Note</button>
    </form>
  </details>`;
}

function refreshNotes(sid) {
  const el = app.querySelector(`[data-notes="${sid}"]`);
  if (el) { el.outerHTML = notesHTML(sid); app.querySelector(`[data-notes="${sid}"]`).open = true; }
}

app.addEventListener('submit', e => {
  const f = e.target.closest('[data-note-form]');
  if (!f) return;
  e.preventDefault();
  const body = f.elements.body.value.trim();
  if (!body) return;
  busy(e.submitter, async () => {
    const n = await sb.from('notes').insert({ session_id: f.dataset.noteForm, body, from_coach: me.isCoach }).select().single().then(must);
    notesCtx.notes.push(n);
    refreshNotes(n.session_id);
  });
});

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-del-note]');
  if (!b) return;
  if (!await ask({ title: 'Delete This Note?', body: "<p>This can't be undone.</p>", ok: 'Delete', warn: true })) return;
  const id = b.dataset.delNote, n = notesCtx.notes.find(x => x.id === id);
  busy(b, async () => {
    must(await sb.from('notes').delete().eq('id', id));
    notesCtx.notes = notesCtx.notes.filter(x => x.id !== id);
    refreshNotes(n.session_id);
  });
});

boot();
</script>
</body>
</html>
