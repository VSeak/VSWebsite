<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F1EC; --card: #FFFFFF; --ink: #1F1D1A; --muted: #6B665E; --line: #E2DDD4; --accent: #C0503A;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161412; --card: #211E1B; --ink: #EEE9E2; --muted: #A39C91; --line: #36312C; --accent: #E27458;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161412; --card: #211E1B; --ink: #EEE9E2; --muted: #A39C91; --line: #36312C; --accent: #E27458;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 3rem 16px; }
h1, h2 { font-family: "Space Grotesk", Inter, sans-serif; line-height: 1.2; margin: 0 0 .5rem; }
h1 { font-size: 2rem; }
.muted { color: var(--muted); }
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-top: 2rem; }
.app { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem;
  color: var(--ink); text-decoration: none; }
.app:hover { border-color: var(--accent); }
.app h2 { font-size: 1.15rem; color: var(--accent); }
.app p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Welcome</h1>
  <p class="muted">Pick where you're headed.</p>
  <!-- One card per app. Each app lives in its own folder. -->
  <div class="apps">
    <a class="app" href="coaching/">
      <h2>Bouldering Coaching</h2>
      <p>Students: sign in to see your training plan.</p>
    </a>
  </div>
</main>
</body>
</html>
