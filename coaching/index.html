      <button class="icon ghost" data-act="del-ex" data-s="${i}" data-e="${e}" title="Remove exercise" aria-label="Remove exercise">×</button></div>`).join('')}
    <div class="row between" style="margin-top:.7rem">
      <button class="ghost small" data-act="add-ex" data-s="${i}">+ Add Exercise</button>
      <div class="row">
        <button class="icon ghost" data-act="up" data-s="${i}" title="Move up" aria-label="Move up">↑</button>
        <button class="icon ghost" data-act="down" data-s="${i}" title="Move down" aria-label="Move down">↓</button>
        <button class="ghost small" data-act="dup" data-s="${i}">Duplicate</button>
        <button class="ghost small danger" data-act="del-session" data-s="${i}">Remove</button>
      </div>
    </div>
    ${draft.savedIds.has(s.id) ? notesHTML(s.id) : ''}
  </article>`;
}

function renderEditor() {
  const p = draft.plan;
  const order = displayOrder();
  let body;
  if (draft.preview) {
    body = planReadHTML(p, order.map(i => draft.sessions[i]), { notes: false });
  } else {
    const weeks = byWeek(order.map(i => ({ week: draft.sessions[i].week, i })));
    body = `<section class="card stack">
      <label>Plan Title<input data-p="title" value="${esc(p.title)}" placeholder="Training Plan" required data-need="Give the plan a title."></label>
      <div class="row">
        <div><label>Start Date<input type="date" data-p="start_date" value="${esc(p.start_date || '')}" required data-need="Pick the day the plan starts."></label></div>
        <label class="check" style="margin-top:1.2rem"><input type="checkbox" data-p="active" ${p.active ? 'checked' : ''}> Current Plan (shown first to the student; replaces their other current plan)</label>
      </div>
      <label>Overview<textarea data-p="overview" rows="3" placeholder="What this plan is for, how to warm up, what to track…">${esc(p.overview)}</textarea></label>
    </section>
    ${weeks.length ? '' : '<p class="muted" style="margin-top:1rem">No sessions yet. Add the first week below.</p>'}
    ${weeks.map(([w, list]) => `<section class="week">
      <h2>Week ${w} <span class="muted">${weekRange(p.start_date, w)}</span></h2>
      ${list.map(({ i }) => sessionEditHTML(draft.sessions[i], i)).join('')}
      <button class="ghost" style="margin-top:.8rem" data-act="add-session" data-week="${w}">+ Add Session to Week ${w}</button>
    </section>`).join('')}
    <div class="row" style="margin-top:1.4rem"><button data-act="add-week" data-need="Add at least one week with a session.">+ Add Week</button></div>
    <section class="card danger-zone row between">
      <button data-act="copy">Copy to a Student</button>
      <button class="ghost danger" data-act="del-plan">Delete Plan</button>
    </section>`;
  }

  view(`${crumbs([['Home', '#/'], ['Students', '#/students'], [p.student.name, '#/student/' + p.student.id], [p.title || 'Untitled Plan']])}
    <div class="card savebar">
      <span id="saveState" class="${dirty ? 'warn' : 'muted'}">${dirty ? 'Unsaved changes' : 'All changes saved'}</span>
      <div class="row"><button data-act="preview">${draft.preview ? 'Back to Editing' : 'Student View'}</button>
      <button class="primary" data-act="save">Save Plan</button></div>
    </div>
    ${body}`, { keepScroll: true });

  app.oninput = e => {
    const t = e.target, d = t.dataset;
    if (d.p && t.type !== 'checkbox') draft.plan[d.p] = t.value;
    else if (d.s != null && d.f !== 'week') {
      const s = draft.sessions[+d.s];
      if (d.e == null) s[d.f] = t.value;
      else if (d.f === 'name') setExName(s.exercises[+d.e], t);
      else s.exercises[+d.e][d.f] = t.value;
    } else return;
    markDirty();
  };
  app.onchange = e => {
    const t = e.target, d = t.dataset;
    if (d.p === 'active') { draft.plan.active = t.checked; markDirty(); }
    if (d.p === 'start_date') renderEditor();          // week date ranges
    if (d.f === 'week') {
      const [s] = draft.sessions.splice(+d.s, 1);      // goes to the end of its new week
      s.week = Math.max(1, parseInt(t.value, 10) || 1);
      draft.sessions.push(s);
      markDirty(); renderEditor();
    }
  };
  app.onclick = async e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const S = draft.sessions, i = +b.dataset.s;
    switch (b.dataset.act) {
      case 'add-ex': S[i].exercises.push(blankEx()); break;
      case 'del-ex': S[i].exercises.splice(+b.dataset.e, 1); break;
      case 'add-session': S.push(blankSession(+b.dataset.week)); break;
      case 'add-week': S.push(blankSession(Math.max(0, ...S.map(s => s.week)) + 1)); break;
      case 'dup': S.splice(i + 1, 0, { ...structuredClone(S[i]), id: crypto.randomUUID() }); break;
      case 'del-session': {
        const n = notesCtx.notes.filter(x => x.session_id === S[i].id).length;
        const lastInWeek = !S.some((x, k) => k !== i && x.week === S[i].week);
        const name = S[i].title.trim() ? `“${esc(S[i].title.trim())}”` : 'This session';
        if (!await ask({ title: lastInWeek ? `Remove Week ${S[i].week}?` : 'Remove This Session?', warn: true, ok: 'Remove',
          body: `<p>${lastInWeek ? `${name} is the only session in week ${S[i].week}, so the week will go too.` : `${name} will be removed from week ${S[i].week}.`}</p>
            ${n ? `<p>It has ${n} note${n > 1 ? 's' : ''}, which will be deleted when you save the plan.</p>` : ''}` })) return;
        S.splice(i, 1); break;
      }
      case 'up': case 'down': {
        const order = displayOrder(), j = order[order.indexOf(i) + (b.dataset.act === 'up' ? -1 : 1)];
        if (j == null || S[j].week !== S[i].week) return;
        [S[i], S[j]] = [S[j], S[i]]; break;
      }
      case 'preview': draft.preview = !draft.preview; renderEditor(); window.scrollTo(0, 0); return;
      case 'save': return savePlan(b);
      case 'copy': return copyPlan(b);
      case 'del-plan': return deletePlan(b);
      default: return;
    }
    markDirty();
    renderEditor();
  };
}

// Which master exercise each plan exercise's values came from (by name_key). An exercise
// starts as its own name's, so fixing a typo or retyping the name keeps the coach's values.
const filledFrom = new WeakMap();

// Typing or picking a master exercise's name fills in its values; the coach can change them after.
function setExName(x, input) {
  if (!filledFrom.has(x)) filledFrom.set(x, exKey(x.name));
  x.name = input.value;
  const m = draft.library.find(y => y.name_key === exKey(x.name));
  if (!m || filledFrom.get(x) === m.name_key) return;
  filledFrom.set(x, m.name_key);
  const row = input.closest('.ex-row');
  for (const [f] of EX_FIELDS) row.querySelector(`[data-f="${f}"]`).value = x[f] = m[f];
}

function sessionRows(planId, keepIds) {
  return displayOrder().map((i, position) => {
    const s = draft.sessions[i];
    return {
      id: keepIds ? s.id : crypto.randomUUID(), plan_id: planId, week: s.week, position,
      title: s.title.trim(), details: s.details.trim(),
      exercises: s.exercises.filter(x => Object.values(x).some(v => String(v).trim())),
    };
  });
}

function savePlan(btn) {
  const p = draft.plan;
  const missing = [!p.title.trim() && '[data-p="title"]', !p.start_date && '[data-p="start_date"]',
    !draft.sessions.length && '[data-act="add-week"]'].filter(Boolean);
  if (missing.length) {
    if (draft.preview) { draft.preview = false; renderEditor(); }
    const els = missing.map(sel => $(sel));
    els.forEach(el => fieldError(el, el.dataset.need));
    els[0].focus();
    return;
  }
  return busy(btn, async () => {
    const rows = sessionRows(p.id, true);
    // The database turns the student's other current plan into a past plan; name it in the message.
    const closed = p.active ? await sb.from('plans').select('title')
      .eq('student_id', p.student.id).eq('active', true).neq('id', p.id).then(must) : [];
    must(await sb.from('plans').update({
      title: p.title.trim(), overview: p.overview.trim(), start_date: p.start_date || null,
      active: p.active, updated_at: new Date().toISOString(),
    }).eq('id', p.id));
    if (rows.length) must(await sb.from('sessions').upsert(rows));
    const gone = [...draft.savedIds].filter(id => !rows.some(r => r.id === id));
    if (gone.length) must(await sb.from('sessions').delete().in('id', gone));
    draft.sessions = rows;
    draft.savedIds = new Set(rows.map(r => r.id));
    notesCtx.notes = notesCtx.notes.filter(n => draft.savedIds.has(n.session_id));
    dirty = false;
    renderEditor();
    const msg = closed.length ? `Plan saved. “${closed[0].title}” is now a past plan.` : 'Plan saved.';
    // The plan is saved even if this fails; the next save tries again.
    const added = await addToMasterList(rows).catch(e => { flash(`${msg} Couldn't add new exercises to the master list: ${msgOf(e)}`, 'error'); });
    if (added != null) flash(added ? `${msg} ${added === 1 ? '1 new exercise' : `${added} new exercises`} added to the master list.` : msg);
  });
}

async function copyPlan(btn) {
  const students = await sb.from('students').select('id,name').order('name').then(must).catch(e => { flash(msgOf(e), 'error'); });
  if (!students) return;
  const f = await ask({ title: 'Copy Plan to a Student', ok: 'Copy Plan',
    body: `<p>Makes a new copy of this plan${dirty ? ', including your unsaved changes,' : ''} for the student you choose.
      Notes and the start date aren't copied.</p>
      <label>Student<select name="to">${students.map(s => `<option value="${s.id}" ${s.id === draft.plan.student.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>` });
  if (!f) return;
  const to = students.find(s => s.id === f.get('to'));
  busy(btn, async () => {
    // The copy is the student's current plan only if they don't have one yet.
    const hasCurrent = (await sb.from('plans').select('id').eq('student_id', to.id).eq('active', true).then(must)).length > 0;
    const np = await sb.from('plans').insert({
      student_id: to.id, title: draft.plan.title.trim() || 'New Plan', overview: draft.plan.overview.trim(),
      active: !hasCurrent,
    }).select('id').single().then(must);
    const rows = sessionRows(np.id, false);
    if (rows.length) must(await sb.from('sessions').insert(rows));
    const added = await addToMasterList(rows);
    flash(`Copied to ${to.name}.${added ? ` ${added === 1 ? '1 new exercise' : `${added} new exercises`} added to the master list.` : ''}`);
  });
}

async function deletePlan(btn) {
  const p = draft.plan;
  if (!await ask({ title: 'Delete This Plan?', warn: true, ok: 'Delete Plan',
    body: `<p>“${esc(p.title || 'Untitled Plan')}” and all its notes will be deleted for good.</p>` })) return;
  busy(btn, async () => {
    must(await sb.from('plans').delete().eq('id', p.id));
    flash('Plan deleted.');
    goTo('#/student/' + p.student.id);
  });
}

// ---------- Plans as the student sees them ----------

function planReadHTML(plan, sessions, { notes = true } = {}) {
  const weeks = byWeek(sessions);
  return `<header class="plan-head">
      <div class="row"><h1>${esc(plan.title || 'Untitled Plan')}</h1>${plan.active ? '' : '<span class="tag">Past Plan</span>'}</div>
      ${plan.start_date ? `<p class="muted">${fmtStart(plan.start_date)}</p>` : ''}
      ${plan.overview ? `<div class="card prose">${para(plan.overview)}</div>` : ''}
    </header>
    ${weeks.length ? weeks.map(([w, list]) => `<section class="week">
      <h2>Week ${w} <span class="muted">${weekRange(plan.start_date, w)}</span></h2>
      ${list.map(s => sessionReadHTML(s, notes)).join('')}</section>`).join('')
    : '<p class="muted">No sessions in this plan yet.</p>'}`;
}

function sessionReadHTML(s, withNotes) {
  const ex = (s.exercises || []).filter(x => Object.values(x).some(v => String(v).trim()));
  return `<article class="card session">
    <h3>${esc(s.title || 'Session')}</h3>
    ${s.details ? `<p class="prose">${para(s.details)}</p>` : ''}
    ${ex.length ? `<table class="ex"><thead><tr><th>Exercise</th><th>Sets</th><th>Reps / Time</th><th>Rest</th><th>Notes</th></tr></thead>
      <tbody>${ex.map(x => `<tr><td>${esc(x.name)}</td><td data-l="Sets">${esc(x.sets)}</td><td data-l="Reps / Time">${esc(x.reps)}</td>
      <td data-l="Rest">${esc(x.rest)}</td><td data-l="Notes">${esc(x.notes)}</td></tr>`).join('')}</tbody></table>` : ''}
    ${withNotes ? notesHTML(s.id) : ''}
  </article>`;
}

async function studentHome() {
  const t = ++navToken;
  view(loading);
  const [plans, goals, coaches, next] = await Promise.all([
    sb.from('plans').select('id,title,active,start_date')
      .order('active', { ascending: false }).order('created_at', { ascending: false }).then(must),
    sb.from('goals').select('*').then(must).then(sortGoals),   // RLS leaves out archived goals
    sb.rpc('coaches_of', { p_id: me.student.id }).then(must),
    sb.from('students').select(NEXT_COLS).eq('id', me.student.id).maybeSingle().then(must),
  ]);
  if (t !== navToken) return;
  const current = plans.filter(p => p.active);
  if (current.length === 1) return studentPlan(current[0].id, plans, goals, coaches, next);

  view(`<h1>${welcome()}</h1>${nextSessionAlert(next)}${goalHTML(goals)}
    ${plans.length ? `<section class="card"><h2>Your Plans</h2><ul class="list">${planLinks(plans)}</ul></section>`
      : "<section class=\"card\"><p>Your coach hasn't shared a plan with you yet. Check back soon.</p></section>"}
    ${achievedHTML(goals)}${yourCoachHTML(coaches)}`);
}

function goalHTML(goals) {
  const cur = goals.filter(g => g.status === 'current');
  if (!cur.length) return '';
  if (cur.length === 1) return `<p class="alert"><strong>Your goal:</strong> ${esc(cur[0].body)}</p>`;
  return `<div class="alert"><strong>Your goals:</strong><ul>${cur.map(g => `<li>${esc(g.body)}</li>`).join('')}</ul></div>`;
}
function achievedHTML(goals) {
  const won = goals.filter(g => g.status === 'achieved');
  return won.length ? `<section class="card" style="margin-top:2rem"><h2>Goals Achieved</h2><ul class="list">${won.map(g =>
    goalItem(g, fmtDay(g.done_at), '<span class="tag ok">Achieved</span>')).join('')}</ul></section>` : '';
}
// Hidden until they have had a coach.
const yourCoachHTML = coaches => coaches.length ? `<section class="card" style="margin-top:2rem"><h2>Your Coach</h2>
  ${coachesHTML(coaches, "You don't have a coach right now.")}</section>` : '';
const planLinks = plans => plans.map(p => `<li><a class="item" href="#/plan/${p.id}"><strong>${esc(p.title || 'Untitled Plan')}</strong>
  ${p.active ? '<span class="tag ok">Current</span>' : '<span class="tag">Past</span>'}</a></li>`).join('');

async function studentPlan(id, allPlans, goals, coaches, next) {
  const t = ++navToken;
  view(loading);
  const [plan, sessions] = await Promise.all([
    sb.from('plans').select('*').eq('id', id).maybeSingle().then(must),
    sb.from('sessions').select('*').eq('plan_id', id).order('week').order('position').then(must),
  ]);
  if (t !== navToken) return;
  if (!plan) { view(`<section class="card narrow"><h1>Plan Not Found</h1><p><a href="#/">Back to your plans</a></p></section>`); return; }
  const notes = sessions.length
    ? await sb.from('notes').select('*').in('session_id', sessions.map(s => s.id)).order('created_at').then(must) : [];
  if (t !== navToken) return;
  notesCtx = { notes, studentName: me.student.name };
  const others = allPlans?.filter(p => p.id !== id) || [];
  view(`${allPlans ? '' : crumbs([['Home', '#/'], [plan.title || 'Untitled Plan']])}
    ${nextSessionAlert(next)}
    ${goals ? goalHTML(goals) : ''}
    ${allPlans && plan.active ? '<h2 class="section-label">Current Plan</h2>' : ''}
    ${planReadHTML(plan, sessions)}
    ${others.length ? `<section class="card" style="margin-top:2rem"><h2>Other Plans</h2><ul class="list">${planLinks(others)}</ul></section>` : ''}
    ${goals ? achievedHTML(goals) : ''}
    ${coaches ? yourCoachHTML(coaches) : ''}`);
}

// ---------- Notes (shared by the student's view and the coach's editor) ----------

function notesHTML(sid) {
  const list = notesCtx.notes.filter(n => n.session_id === sid);
  const canDelete = n => me.isCoach || (n.author_id === me.user.id && !n.from_coach);
  return `<details class="notes" data-notes="${sid}" ${list.length ? 'open' : ''}>
    <summary>${list.length ? `Notes (${list.length})` : 'Add a Note'}</summary>
    ${list.map(n => `<div class="note${n.from_coach ? ' coach' : ''}">
      <div class="note-meta"><strong>${n.from_coach ? 'Coach' : esc(notesCtx.studentName)}</strong> · ${fmtWhen(n.created_at)}
      ${canDelete(n) ? ` · <button type="button" class="link" data-del-note="${n.id}">Delete</button>` : ''}</div>
      <p>${para(n.body)}</p></div>`).join('')}
    <form class="note-form" data-note-form="${sid}">
      <textarea name="body" rows="2" maxlength="4000" required data-need="Write your note first."
        placeholder="${me.isCoach ? 'Reply to your student…' : 'How did it go? Grades sent, how it felt, questions…'}"></textarea>
      <button class="small">+ Post Note</button>
    </form>
  </details>`;
}

function refreshNotes(sid) {
  const el = app.querySelector(`[data-notes="${sid}"]`);
  if (el) { el.outerHTML = notesHTML(sid); app.querySelector(`[data-notes="${sid}"]`).open = true; }
}

app.addEventListener('submit', e => {
  const f = e.target.closest('[data-note-form]');
  if (!f) return;
  e.preventDefault();
  const body = f.elements.body.value.trim();
  if (!body) return;
  busy(e.submitter, async () => {
    const n = await sb.from('notes').insert({ session_id: f.dataset.noteForm, body, from_coach: me.isCoach }).select().single().then(must);
    notesCtx.notes.push(n);
    refreshNotes(n.session_id);
  });
});

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-del-note]');
  if (!b) return;
  if (!await ask({ title: 'Delete This Note?', body: "<p>This can't be undone.</p>", ok: 'Delete', warn: true })) return;
  const id = b.dataset.delNote, n = notesCtx.notes.find(x => x.id === id);
  busy(b, async () => {
    must(await sb.from('notes').delete().eq('id', id));
    notesCtx.notes = notesCtx.notes.filter(x => x.id !== id);
    refreshNotes(n.session_id);
  });
});

boot();
</script>
</body>
</html>
