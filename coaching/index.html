<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouldering Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #F4F6F8; --card: #FFFFFF; --field: #FFFFFF; --ink: #15202B; --muted: #5B6B78;
  --line: #DCE2E7; --accent: #0E7C7B; --accent-ink: #FFFFFF; --soft: #E0F1F0;
  --danger: #B42318; --warn: #9A5B00; --ok: #2F7D4F; --shadow: 0 1px 2px rgba(21,32,43,.06);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1417; --card: #172026; --field: #121A1E; --ink: #E6EDF1; --muted: #93A3AE;
    --line: #29343B; --accent: #3CC7C1; --accent-ink: #06201F; --soft: #16302F;
    --danger: #F97066; --warn: #E3AE5A; --ok: #74C295; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1417; --card: #172026; --field: #121A1E; --ink: #E6EDF1; --muted: #93A3AE;
  --line: #29343B; --accent: #3CC7C1; --accent-ink: #06201F; --soft: #16302F;
  --danger: #F97066; --warn: #E3AE5A; --ok: #74C295; --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
h1, h2, h3 { font-family: "Space Grotesk", Inter, sans-serif; line-height: 1.2; margin: 0 0 .5rem; }
h1 { font-size: 1.8rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.05rem; }
a { color: var(--accent); }
p { margin: 0 0 .75rem; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .8rem 16px; border-bottom: 1px solid var(--line); background: var(--card); }
.brand { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 1.15rem; color: var(--ink); text-decoration: none; }
.who { display: flex; min-width: 0; margin-left: auto; white-space: nowrap; color: var(--muted); font-size: .9rem; }
#whoName { overflow: hidden; text-overflow: ellipsis; }
#whoRoles:not(:empty)::before { content: "·"; margin: 0 .4rem; }
@media (max-width: 600px) {
  .top { flex-wrap: wrap; row-gap: .35rem; }
  .who { order: 3; flex-basis: 100%; margin: 0; font-size: .85rem; }
  #signOut { margin-left: auto; }
}
main { max-width: 1040px; margin: 0 auto; padding: 1.5rem 16px 4rem; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem; box-shadow: var(--shadow); }
.card + .card, .stack > * + * { margin-top: .9rem; }
.narrow { max-width: 420px; margin: 2rem auto; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.end { justify-content: flex-end; }
.grow { flex: 1; min-width: 180px; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: .85rem; margin-top: .4rem; }
/* A card's description sits just under its heading */
.card > h2 + .hint, .card > .row:first-child + .hint { margin-top: -.2rem; }
.alert { background: var(--soft); border-radius: 8px; padding: .6rem .8rem; }

label { display: block; font-weight: 500; font-size: .9rem; }
label > input, label > textarea, label > select { margin-top: .25rem; }
input, textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--field);
  border: 1px solid var(--line); border-radius: 8px; padding: .5rem .6rem; }
textarea { resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
[aria-invalid="true"] { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 7%, var(--field)); }
[aria-invalid="true"]:focus { outline-color: var(--danger); }
.field-error { display: block; color: var(--danger); font-size: .85rem; font-weight: 500; margin-top: .3rem; }
.stack > .field-error { margin-top: .3rem; }
label.check { display: flex; align-items: center; gap: .5rem; font-weight: 400; }
label.check input { width: auto; margin: 0; }
fieldset.roles { border: 0; margin: 0; padding: 0; display: grid; gap: .4rem; }
fieldset.roles legend { font-weight: 500; font-size: .9rem; padding: 0; margin-bottom: .3rem; }
fieldset.roles label.check { align-items: flex-start; }
fieldset.roles label.check input { margin-top: .3rem; }

button { font: inherit; font-weight: 500; cursor: pointer; border-radius: 8px; padding: .5rem .9rem;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .55; cursor: progress; }
button:disabled[data-blocked] { cursor: not-allowed; }
.hint.need { color: var(--warn); font-weight: 500; }
button.ghost { background: transparent; }
button.danger { color: var(--danger); }
/* Primary buttons show only an accent edge until hovered */
button.primary { border-color: var(--accent); }
button.primary.danger { border-color: var(--danger); }
button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary.danger:hover:not(:disabled) { background: var(--danger); border-color: var(--danger); color: #fff; }
button.small { padding: .3rem .65rem; font-size: .85rem; }
button.icon { padding: .25rem .55rem; line-height: 1; }
button.link { border: 0; background: none; padding: 0; color: var(--accent); font-size: inherit; text-decoration: underline; }

.crumb-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; margin-bottom: .8rem; }
.crumbs { display: flex; flex-wrap: wrap; gap: .4rem; font-size: .9rem; color: var(--muted); }
.crumbs a { text-decoration: none; }
a.back { font-weight: 500; font-size: .85rem; padding: .3rem .65rem; border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink); text-decoration: none; white-space: nowrap; }
a.back:hover { border-color: var(--muted); }

.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
/* Rows reach a little past the text on each side, so the hover fills the whole row */
.list a.item { display: flex; justify-content: space-between; gap: 1rem; padding: .7rem .6rem; margin: 0 -.6rem;
  border-radius: 8px; color: var(--ink); text-decoration: none; flex-wrap: wrap; }
.list a.item:hover { background: color-mix(in srgb, var(--soft) 70%, transparent); }
.list a.item:hover strong { color: var(--accent); }
.item-sub { display: block; color: var(--muted); font-size: .85rem; }
.tag { display: inline-flex; align-items: center; gap: .35rem; align-self: center; font-size: .75rem; font-weight: 600;
  line-height: 1.5; padding: .15rem .6rem; border-radius: 99px; border: 1px solid var(--line);
  background: var(--soft); color: var(--muted); white-space: nowrap; }
.tag.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent);
  background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.tag.ok::before { content: ""; width: .4rem; height: .4rem; border-radius: 50%; background: currentColor; }
.tag.accent { border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
.tag.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent);
  background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
/* A next session that has ended: the card and a banner in the warn color, so the coach sets a new one. */
.card.overdue { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
.warn-box { background: color-mix(in srgb, var(--warn) 14%, transparent); border-left: 4px solid var(--warn);
  border-radius: 8px; padding: .6rem .8rem; }
.warn-box strong { color: var(--warn); }

/* Coach home */
/* Every tile the same size: rows share the tallest tile's height, and the stat sits at the bottom */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); grid-auto-rows: 1fr; gap: 1rem; margin-top: 1rem; }
.tiles > .card { margin-top: 0; }
a.tile { display: flex; flex-direction: column; color: var(--ink); text-decoration: none; }
a.tile:hover { border-color: var(--accent); }
a.tile:hover h2 { color: var(--accent); }
a.tile p { margin: 0; }
.tile-stat { margin-top: auto !important; padding-top: .6rem; font-weight: 600; color: var(--accent); }

/* Goals */
.goal { display: flex; justify-content: space-between; align-items: flex-start; gap: .4rem .8rem; flex-wrap: wrap; padding: .6rem 0; }
.goal-text { flex: 1; min-width: 180px; }
.goal-text p { margin: 0; }
.goal-group { margin-top: 1.1rem; }
details.goal-group summary { cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--accent); }

/* Coaches */
.coach { display: flex; justify-content: space-between; align-items: baseline; gap: .2rem .8rem; flex-wrap: wrap; padding: .5rem 0; }
.alert ul { margin: .3rem 0 0; padding-left: 1.2rem; }
.next-session { margin: 0 0 .8rem; }

.note-wrap { padding: .6rem 0; border-top: 1px solid var(--line); }
.feed h2 + .note-wrap { border-top: 0; }
.note-wrap p { margin: .2rem 0 0; }

/* Plans */
.plan-head { margin-bottom: 1.2rem; }
.section-label { margin: 1.4rem 0 .3rem; font-size: .95rem; color: var(--muted); }
.week { margin-top: 1.6rem; }
.week > h2 { display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
.week > h2 .muted { font: 400 .9rem Inter, sans-serif; }
.session { margin-top: .8rem; }
.prose { white-space: normal; }
table.ex { width: 100%; border-collapse: collapse; margin: .6rem 0; font-size: .92rem; }
table.ex th { text-align: left; font-weight: 600; color: var(--muted); font-size: .8rem; padding: .3rem .5rem .3rem 0; border-bottom: 1px solid var(--line); }
table.ex td { padding: .45rem .5rem .45rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.ex td:first-child { font-weight: 600; }
@media (max-width: 600px) {
  table.ex thead { display: none; }
  table.ex tr { display: block; padding: .5rem 0; border-bottom: 1px solid var(--line); }
  table.ex td { display: block; border: 0; padding: .1rem 0; }
  table.ex td:empty { display: none; }
  table.ex td:not(:first-child)::before { content: attr(data-l) ": "; color: var(--muted); }
}

/* Notes */
details.notes { margin-top: .8rem; border-top: 1px dashed var(--line); padding-top: .6rem; }
details.notes summary { cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--accent); }
.note { margin-top: .6rem; padding: .55rem .7rem; border-radius: 8px; background: var(--bg); }
.note.coach { background: var(--soft); }
.note p { margin: .2rem 0 0; }
.note-meta { font-size: .8rem; color: var(--muted); }
.note-form { margin-top: .6rem; display: grid; gap: .4rem; justify-items: start; }

/* Plan editor */
.savebar { position: sticky; top: .5rem; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; }
#saveState.warn { color: var(--warn); font-weight: 600; }
.session-edit .wk { width: 90px; }
.ex-head, .ex-row { display: grid; grid-template-columns: 2fr .7fr 1.1fr .8fr 2fr auto; gap: .4rem; align-items: center; }
.ex-head { font-size: .8rem; font-weight: 600; color: var(--muted); margin-top: .8rem; }
.ex-head span:last-child { width: 2rem; }
.ex-row { margin-top: .4rem; }
/* Exercise name picker (the master list), in place of the browser's datalist popup */
.combo-menu { position: absolute; z-index: 20; margin: 0; padding: .3rem; list-style: none; max-height: 16rem; overflow: hidden auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.combo-menu li { display: flex; align-items: baseline; gap: .8rem; padding: .45rem .6rem; border-radius: 6px; cursor: pointer; }
.combo-menu li > :first-child { flex: 1; }
.combo-menu li .muted { font-size: .8rem; max-width: 50%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.combo-menu li:hover { background: color-mix(in srgb, var(--soft) 60%, transparent); }
.combo-menu li[aria-selected="true"] { background: var(--soft); }
.combo-menu mark { background: none; color: var(--accent); font-weight: 600; }
@media (max-width: 700px) {
  .ex-head { display: none; }
  .ex-row { grid-template-columns: 1fr 1fr 1fr auto; padding: .5rem 0; border-top: 1px solid var(--line); }
  .ex-row > [data-f="name"], .ex-row > [data-f="notes"] { grid-column: 1 / -1; }
  .ex-row > button { grid-column: 4; grid-row: 2; }
}
.danger-zone { margin-top: 2rem; }

#flash { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); padding: .6rem 1rem; border-radius: 8px; z-index: 50; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
#flash.error { background: var(--danger); color: #fff; }

dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink);
  padding: 1.2rem; width: min(440px, calc(100% - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog .row { margin-top: 1rem; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"></a>
  <div class="who" hidden><span id="whoName"></span><span id="whoRoles"></span></div>
  <button id="signOut" class="ghost small" hidden>Sign Out</button>
</header>
<main id="app"></main>
<div id="flash" role="status" hidden></div>
<dialog id="dlg"></dialog>

<script>
// ---- Fill these in from Supabase (see SETUP.md) ----
const CONFIG = {
  siteName: "Bouldering Coaching",
  supabaseUrl: "https://loxyrqffevvdhwltccxr.supabase.co",   // e.g. https://abcd1234.supabase.co
  supabaseKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxveHlycWZmZXZ2ZGh3bHRjY3hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNzc5NzAsImV4cCI6MjEwNTk1Mzk3MH0.czgnKpu18kuEghIC3Ixy6jR-AFvBHQVH7rDDqmFF_EI",   // the publishable (or "anon") key. Never the secret key.
  siteUrl: "https://vseak.github.io/VSWebsite/coaching/",   // where emailed sign-in links go, even when sent from localhost. Leave "" to use the current address.
};

const $ = (sel, root = document) => root.querySelector(sel);
const app = $('#app');
const BASE = location.origin + location.pathname;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const para = s => esc(s).replace(/\n/g, '<br>');
const must = ({ data, error }) => { if (error) throw error; return data; };
const loading = '<p class="muted">Loading…</p>';

document.title = CONFIG.siteName;
$('.brand').textContent = CONFIG.siteName;

let sb, mailer;
let me = null;               // {user, roles, isStaff, isCoach, isAdmin, student}. roles: staff roles, e.g. ['admin', 'coach']; [] for a student
let wantsPassword = new URLSearchParams(location.search).has('setpw');
let linkError = null;        // from an expired or used email link
let dirty = false;           // unsaved plan edits
let draft = null;            // plan open in the editor
let notesCtx = { notes: [], studentName: '' };
let currentHash = location.hash;
let navToken = 0;

if (location.hash && !location.hash.startsWith('#/')) {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('error_code') === 'otp_expired') linkError = 'That link has expired or was already used. Ask your coach to send a new one.';
  else if (h.get('error_description')) linkError = h.get('error_description');
}

// ---------- Helpers ----------

function view(html, { keepScroll = false } = {}) {
  app.oninput = app.onchange = app.onclick = null;
  $('#exMenu')?.setAttribute('hidden', '');   // its field is about to go
  app.innerHTML = html;
  if (!keepScroll) window.scrollTo(0, 0);
}

let flashTimer;
function flash(msg, kind = 'ok') {
  const f = $('#flash');
  f.textContent = msg; f.className = kind; f.hidden = false;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { f.hidden = true; }, kind === 'error' ? 7000 : 3500);
}

function msgOf(e) {
  const m = e?.message || String(e);
  if (/invalid login credentials/i.test(m)) return "That email and password don't match. Forgot your password? Ask your coach for a new sign-in link.";
  if (/failed to fetch/i.test(m)) return "Couldn't reach the server. Check your connection and try again.";
  if (/does not exist|could not find the function/i.test(m)) return m + ' (Has supabase/schema.sql been run?)';
  return m;
}

async function busy(btn, fn) {
  btn.disabled = true;
  try { return await fn(); }
  catch (e) { flash(msgOf(e), 'error'); }
  finally { btn.disabled = false; }
}

// Field errors: a red field with a message under it, instead of the browser's pop-up.
// Each required field says what to do in data-need. Typing in the field clears it.
function fieldError(el, msg) {
  clearFieldError(el);
  el.setAttribute('aria-invalid', 'true');
  const err = document.createElement('span');
  err.className = 'field-error';
  err.id = 'err-' + Math.random().toString(36).slice(2);
  err.textContent = msg;
  el.setAttribute('aria-describedby', err.id);
  const label = el.closest('label'), row = el.parentElement.closest('.row');
  (label || row || el).after(err);
}
function clearFieldError(el) {
  if (el.getAttribute('aria-invalid') !== 'true') return;
  el.removeAttribute('aria-invalid');
  document.getElementById(el.getAttribute('aria-describedby'))?.remove();
  el.removeAttribute('aria-describedby');
}
function validityMsg(el) {
  const v = el.validity;
  if (v.valueMissing || v.customError) return el.dataset.need || 'Fill this in.';
  if (v.typeMismatch && el.type === 'email') return 'Enter a full email address, like name@example.com.';
  if (v.rangeUnderflow && el.dataset.low) return el.dataset.low;
  if (v.tooShort) return `Use at least ${el.minLength} characters.`;
  return el.validationMessage;
}
let focusedError = false;
document.addEventListener('invalid', e => {
  e.preventDefault();
  fieldError(e.target, validityMsg(e.target));
  if (!focusedError) { focusedError = true; e.target.focus(); setTimeout(() => { focusedError = false; }); }
}, true);
document.addEventListener('input', e => {
  const el = e.target;
  if (!el.matches?.('input, textarea')) return;
  // Only spaces counts as empty.
  if (el.required && el.type !== 'password') el.setCustomValidity(el.value && !el.value.trim() ? 'empty' : '');
  clearFieldError(el);
}, true);

// Returns the form's FormData when confirmed, or null. Settles on submit, not close.
function ask({ title, body = '', ok = 'OK', warn = false }) {
  const d = $('#dlg');
  d.innerHTML = `<form method="dialog"><h2>${esc(title)}</h2>${body}
    <div class="row end"><button value="cancel" formnovalidate class="ghost">Cancel</button>
    <button value="ok" class="primary${warn ? ' danger' : ''}">${esc(ok)}</button></div></form>`;
  return new Promise(resolve => {
    const f = d.querySelector('form');
    f.addEventListener('submit', e => resolve(e.submitter?.value === 'ok' ? new FormData(f) : null), { once: true });
    d.addEventListener('cancel', () => resolve(null), { once: true });
    d.showModal();
  });
}

// The full trail from Home, with a Back button to the page one level up (the last crumb with a link).
// Both change the hash, so unsaved edits still get the leave check in onHashChange.
function crumbs(items) {
  const up = items.filter(([, href]) => href).at(-1)?.[1];
  return `<div class="crumb-bar">${up ? `<a class="back" href="${up}">← Back</a>` : ''}
    <nav class="crumbs" aria-label="Breadcrumb">${items.map(([label, href]) =>
    href ? `<a href="${href}">${esc(label)}</a>` : `<span>${esc(label)}</span>`).join('<span>/</span>')}</nav></div>`;
}

// Student invites wait until the coach has saved a plan and added a goal (student_ready() in schema.sql).
// need is what's missing, as a sentence of HTML; empty means the invite can go.
function gateInvite(need) {
  const btn = $('#inviteBtn'), hint = $('#inviteNeed');
  if (!btn) return;
  btn.disabled = !!need;
  btn.toggleAttribute('data-blocked', !!need);
  hint.hidden = !need;
  hint.innerHTML = need || '';
}

const day = d => new Date(d + 'T00:00');
const fmtDate = d => day(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
// "Started Sep 1, 2026" once the day has come (today included), "Starts on Oct 3, 2026" before.
const fmtStart = d => (day(d) <= new Date() ? 'Started ' : 'Starts on ') + fmtDate(d);
const fmtWhen = t => new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
function weekRange(start, w) {
  if (!start) return '';
  const a = day(start); a.setDate(a.getDate() + 7 * (w - 1));
  const b = new Date(a); b.setDate(b.getDate() + 6);
  const f = x => x.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  return `${f(a)} – ${f(b)}`;
}

// Sign-in links (only ever sent by the coach: invites and new sign-in links) go through a separate
// client that never stores a session, so sending one can't touch the coach's.
// firstName (from the coach's invite) is saved on a new login, and the Confirm
// signup email shows it as {{ .Data.first_name }}.
// staff: true marks a coach or admin invite, so the emails use their staff wording ({{ if .Data.staff }}).
function sendLink(email, firstName = '', staff = false) {
  const data = firstName || staff ? { ...(firstName && { first_name: firstName }), ...(staff && { staff: true }) } : undefined;
  return mailer.auth.signInWithOtp({ email, options: { shouldCreateUser: true, data, emailRedirectTo: (CONFIG.siteUrl || BASE) + '?setpw=1' } });
}

// ---------- Start-up & routing ----------

async function boot() {
  if (!CONFIG.supabaseUrl || !CONFIG.supabaseKey || !window.supabase) {
    view(`<section class="card narrow"><h1>Almost There</h1>
      <p>This site isn't connected to Supabase yet. Follow <strong>SETUP.md</strong>, then fill in
      <code>supabaseUrl</code> and <code>supabaseKey</code> near the top of the script in <code>index.html</code>.</p></section>`);
    return;
  }
  sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth: { flowType: 'implicit' } });
  mailer = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, {
    auth: { flowType: 'implicit', persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'mailer' },
  });
  sb.auth.onAuthStateChange(event => {
    if (event === 'PASSWORD_RECOVERY') wantsPassword = true;
    if (event === 'SIGNED_OUT' && me) { me = null; dirty = false; setTimeout(route); }
  });

  const { data: { session } } = await sb.auth.getSession();   // also reads a link's token from the URL
  if (location.search || !location.hash.startsWith('#/')) history.replaceState(null, '', BASE + '#/');
  currentHash = location.hash;

  if (session) {
    try { await loadMe(session.user); }
    catch (e) { showError(e); return; }
  }
  window.addEventListener('hashchange', onHashChange);
  window.addEventListener('beforeunload', e => { if (unsaved()) { e.preventDefault(); e.returnValue = ''; } });
  route();
}

async function loadMe(user) {
  const roles = await sb.rpc('my_roles').then(must);
  let student = null;
  if (!roles) {
    await sb.rpc('claim_student').then(must);
    student = await sb.from('students').select('*').eq('user_id', user.id).maybeSingle().then(must);
  }
  // Staff read their own row for the greeting (admins can read every row, so match the email).
  // Falls back to the first name from their invite.
  const staffRow = roles && (await sb.from('staff').select('first_name, name').eq('email', user.email.toLowerCase()).maybeSingle()).data;
  const firstName = roles ? (staffRow?.first_name || user.user_metadata?.first_name || '') : (student?.first_name || '');
  const fullName = (roles ? staffRow?.name : student?.name) || firstName;
  me = { user, roles: roles || [], isStaff: !!roles, isCoach: !!roles?.includes('coach'), isAdmin: !!roles?.includes('admin'), student, firstName, fullName };
}

const welcome = () => `Welcome${me.firstName ? ' ' + esc(me.firstName) : ''}!`;

// Unsaved edits: the plan editor's draft (dirty), or a form field changed from how the page drew it.
// Pages redraw their forms after a save, so a changed field is one that hasn't been saved (or added) yet.
const fieldChanged = el => el.type === 'checkbox' || el.type === 'radio' ? el.checked !== el.defaultChecked
  : el.tagName === 'SELECT' ? el.selectedIndex !== Math.max(0, [...el.options].findIndex(o => o.defaultSelected))
  : el.value !== el.defaultValue;
const unsaved = () => dirty || [...app.querySelectorAll('form :is(input, textarea, select)')].some(fieldChanged);

// Asks before unsaved edits are lost. True when there are none or the user says go ahead.
async function okToLeave(signOut = false) {
  if (!unsaved()) return true;
  const ok = await ask({ title: signOut ? 'Sign Out Without Saving?' : 'Leave Without Saving?', ok: signOut ? 'Sign Out' : 'Leave', warn: true,
    body: dirty ? "<p>Your changes to this plan haven't been saved.</p>" : "<p>You have changes on this page that haven't been saved.</p>" });
  if (ok) dirty = false;
  return !!ok;
}

// Goes to another page without the leave check, after a save, add or delete that ends there.
function goTo(hash) {
  dirty = false;
  app.querySelectorAll('form').forEach(f => f.reset());
  location.hash = hash;
}

async function onHashChange() {
  if (location.hash === currentHash) return;
  if (!await okToLeave()) { history.replaceState(null, '', currentHash); return; }
  currentHash = location.hash;
  route();
}

// Header: full name · roles (staff) or full name (students). The email stands in only if there's no name.
function setWho() {
  $('.who').hidden = !me;
  $('#whoName').textContent = me ? (me.fullName || me.user.email) : '';
  $('#whoRoles').textContent = me?.isStaff ? rolesText(me.roles) : '';
}

function route() {
  setWho();
  $('#signOut').hidden = !me;
  if (!me) return viewLogin();
  if (wantsPassword || (!me.isStaff && !me.user.user_metadata?.password_set)) return viewSetPassword();
  const [, page, id] = location.hash.split('/');
  const go = me.isStaff
    ? (me.isCoach && page === 'students' ? adminStudents() : me.isCoach && page === 'student' && id ? adminStudent(id)
      : me.isCoach && page === 'plan' && id ? adminPlan(id)
      : (me.isCoach || me.isAdmin) && page === 'exercises' ? adminExercises()
      : me.isAdmin && page === 'users' ? adminUsers() : me.isAdmin && page === 'user' && id ? adminUser(id) : adminHome())
    : !me.student ? viewNoAccess()
    : (page === 'plan' && id ? studentPlan(id) : studentHome());
  Promise.resolve(go).catch(showError);
}

function showError(e) {
  view(`<section class="card narrow"><h1>Something Went Wrong</h1><p>${esc(msgOf(e))}</p><p><a href="#/">Back to the start</a></p></section>`);
}

$('#signOut').onclick = async () => {
  if (!await okToLeave(true)) return;
  await sb.auth.signOut();
  me = null;
  history.replaceState(null, '', BASE + '#/');
  currentHash = location.hash;
  route();
};

// ---------- Sign-in pages ----------

function viewLogin() {
  view(`<section class="card narrow">
    <h1>Sign In</h1>
    ${linkError ? `<p class="alert">${esc(linkError)}</p>` : ''}
    <form id="loginForm" class="stack">
      <label>Email<input type="email" name="email" autocomplete="email" required data-need="Enter your email."></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required data-need="Enter your password."></label>
      <button class="primary">Sign In</button>
    </form>
    <p class="hint">Forgot your password? Ask your coach for a new sign-in link.</p>
  </section>`);

  $('#loginForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    busy(e.submitter, async () => {
      const { data, error } = await sb.auth.signInWithPassword({ email: f.get('email').trim(), password: f.get('password') });
      if (error) throw error;
      await loadMe(data.user);
      linkError = null;
      route();
    });
  };
}

function viewSetPassword() {
  view(`<section class="card narrow"><h1>Choose a Password</h1>
    <p class="muted">You'll sign in with ${esc(me.user.email)} and this password from now on.</p>
    <form id="pwForm" class="stack">
      <label>New Password<input type="password" name="pw" minlength="8" autocomplete="new-password" required data-need="Choose a password."></label>
      <label>Confirm Password<input type="password" name="pw2" minlength="8" autocomplete="new-password" required data-need="Enter the same password again."></label>
      <p class="hint">At least 8 characters.</p>
      <button class="primary">Save Password</button>
    </form></section>`);
  $('#pwForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    if (f.get('pw') !== f.get('pw2')) { const el = e.target.elements.pw2; fieldError(el, "The passwords don't match."); el.focus(); return; }
    busy(e.submitter, async () => {
      let { data, error } = await sb.auth.updateUser({ password: f.get('pw'), data: { password_set: true } });
      // Already their password (e.g. used a sign-in link to get back in): that's fine, keep it.
      if (error?.code === 'same_password') ({ data, error } = await sb.auth.updateUser({ data: { password_set: true } }));
      if (error) throw error;
      me.user = data.user;
      wantsPassword = false;
      flash('Password saved.');
      route();
    });
  };
}

function viewNoAccess() {
  view(`<section class="card narrow"><h1>No Plan Linked Yet</h1>
    <p>You're signed in as ${esc(me.user.email)}, but this account isn't on the student list.
    Ask your coach to check which email they have for you.</p></section>`);
}

// ---------- Staff: home ----------

// One tile per staff page. Add new pages here. stat() is optional and returns a short line for the tile.
// roles says who sees the tile (route() checks it too): coaches get the coaching pages, admins the Users page.
const ADMIN_PAGES = [
  { href: '#/students', title: 'Students', roles: ['coach'], blurb: 'Add students, build their plans and goals, and send invites.',
    stat: async () => {
      const { count, error } = await sb.from('students').select('id', { count: 'exact', head: true }).is('training_ended_at', null);
      if (error) throw error;
      return count === 1 ? '1 active student' : `${count} active students`;
    } },
  { href: '#/exercises', title: 'Master Exercise List', roles: ['coach', 'admin'], blurb: 'The exercises plans pick from, with their usual sets, reps, rest and notes.',
    stat: async () => {
      const { count, error } = await sb.from('exercises').select('id', { count: 'exact', head: true });
      if (error) throw error;
      return count === 1 ? '1 exercise' : `${count} exercises`;
    } },
  { href: '#/users', title: 'Users', roles: ['admin'], blurb: 'See and edit everyone who can sign in: admins, coaches and students.',
    stat: async () => {
      const users = await sb.rpc('list_users').select('id').then(must);
      return users.length === 1 ? '1 user' : `${users.length} users`;
    } },
];

async function adminHome() {
  const t = ++navToken;
  const pages = ADMIN_PAGES.filter(p => p.roles.some(r => me.roles.includes(r)));
  view(`<h1>${welcome()}</h1>
    <div class="tiles">${pages.map((p, i) => `<a class="card tile" href="${p.href}">
      <h2>${esc(p.title)}</h2><p class="muted">${esc(p.blurb)}</p>
      ${p.stat ? `<p class="tile-stat" data-stat="${i}">&nbsp;</p>` : ''}</a>`).join('')}</div>`);
  pages.forEach((p, i) => p.stat?.().then(text => {
    const el = t === navToken && app.querySelector(`[data-stat="${i}"]`);
    if (el) el.textContent = text;
  }).catch(() => {}));
}

// ---------- Admin: users ----------

// Staff roles are separate, and one person can have several (staff.roles in schema.sql).
// To add a role: allow it in the staff.roles check, then add it to ROLE_LABEL, ROLE_PLURAL, ROLE_HINT and STAFF_ROLES.
const ROLE_LABEL = { admin: 'Admin', coach: 'Coach', student: 'Student' };
const ROLE_PLURAL = { admin: 'Admins', coach: 'Coaches', student: 'Students' };
const ROLE_HINT = { admin: 'Sees and edits every user.', coach: 'Manages students, plans and goals.' };
const STAFF_ROLES = ['admin', 'coach'];
// Roles in STAFF_ROLES order (Admin before Coach), anything else after.
const roleRank = r => (i => i < 0 ? STAFF_ROLES.length : i)(STAFF_ROLES.indexOf(r));
const sortRoles = roles => [...roles].sort((a, b) => roleRank(a) - roleRank(b));
const rolesText = roles => sortRoles(roles).map(r => ROLE_LABEL[r] || r).join(' · ');
const roleTags = roles => sortRoles(roles).map(r => `<span class="tag${r === 'student' ? '' : ' accent'}">${esc(ROLE_LABEL[r] || r)}</span>`).join('');
const userStatus = u => u.last_sign_in_at ? 'Active' : u.invited_at ? 'Invited' : 'Not Invited';
const roleOrder = u => Math.min(...u.roles.map(r => Object.keys(ROLE_LABEL).indexOf(r)));
const isMine = u => u.kind === 'staff' && u.email === me.user.email?.toLowerCase();

async function adminUsers() {
  const t = ++navToken;
  view(loading);
  const users = await sb.rpc('list_users').then(must);
  if (t !== navToken) return;
  users.sort((a, b) => (roleOrder(a) - roleOrder(b)) || (a.name || a.email || '').localeCompare(b.name || b.email || ''));

  const count = r => users.filter(u => u.roles.includes(r)).length;
  view(`${crumbs([['Home', '#/'], ['Users']])}
  <h1>Users</h1>
  <div class="grid2">
    <section class="card">
      <div class="row">
        <input id="userSearch" class="grow" type="search" placeholder="Search by name or email" aria-label="Search by name or email" autocomplete="off">
        <select id="userRole" aria-label="Role" style="width:auto">
          <option value="">Everyone (${users.length})</option>
          ${Object.keys(ROLE_LABEL).map(r => `<option value="${r}">${ROLE_PLURAL[r]} (${count(r)})</option>`).join('')}
        </select>
      </div>
      <ul class="list" id="userList" style="margin-top:.6rem"></ul>
    </section>
    <aside>
      <section class="card"><h2>Add Staff</h2>
        <p class="hint">Add students on the ${me.isCoach ? '<a href="#/students">Students</a> page' : 'Students page (coaches only)'}.</p>
        <form id="addStaff" class="stack">
          <label>First Name<input name="first_name" required data-need="Enter their first name." autocomplete="off"></label>
          <label>Last Name<input name="last_name" autocomplete="off"></label>
          <label>Email<input type="email" name="email" required data-need="Enter their email to send the invite." autocomplete="off"></label>
          ${rolesFieldset(['coach'])}
          <button class="primary">+ Add and Send Invite</button>
        </form>
      </section>
    </aside>
  </div>`);

  const search = $('#userSearch'), role = $('#userRole');
  function renderList() {
    const q = search.value.trim().toLowerCase(), r = role.value;
    const shown = users.filter(u => (!r || u.roles.includes(r)) &&
      (!q || (u.name || '').toLowerCase().includes(q) || (u.email || '').includes(q)));
    $('#userList').innerHTML = shown.map(u => `<li><a class="item" href="#/user/${u.id}">
      <span><strong>${esc(u.name || u.email)}</strong>${isMine(u) ? ' <span class="muted">(you)</span>' : ''}
        <span class="item-sub">${u.email ? esc(u.email) : 'No email yet'}</span></span>
      <span class="row">${roleTags(u.roles)}<span class="tag${u.last_sign_in_at ? ' ok' : ''}">${userStatus(u)}</span></span></a></li>`).join('')
      || `<li><p class="muted" style="margin:.6rem 0">${users.length ? 'Nobody matches that search.' : 'No users yet.'}</p></li>`;
  }
  renderList();
  search.oninput = role.onchange = renderList;

  $('#addStaff').onsubmit = e => {
    e.preventDefault();
    const roles = checkedRoles(e.target);
    if (!roles) return;
    const f = new FormData(e.target);
    const row = { first_name: f.get('first_name').trim(), last_name: f.get('last_name').trim(), email: f.get('email').trim().toLowerCase(), roles };
    busy(e.submitter, async () => {
      const { data, error } = await sb.from('staff').insert(row).select('id').single();
      if (error) throw error.code === '23505' ? new Error('Someone on the staff already has that email.') : error;
      // Send the invite before opening their page, so it draws once (with Invited) instead of twice.
      const { error: mailError } = await sendLink(row.email, row.first_name, true);
      if (!mailError) must(await sb.from('staff').update({ invited_at: new Date().toISOString() }).eq('id', data.id));
      goTo('#/user/' + data.id);
      if (mailError) flash(`${row.first_name} added, but the invite didn't send: ${msgOf(mailError)}`, 'error');
      else flash(`${row.first_name} added. Invite sent to ${row.email}.`);
    });
  };
}

// Role checkboxes for a staff form. locked roles stay ticked and can't be changed (your own Admin role).
function rolesFieldset(current, locked = []) {
  return `<fieldset class="roles"><legend>Roles</legend>
    ${STAFF_ROLES.map(r => `<label class="check"><input type="checkbox" name="roles" value="${r}"
      ${current.includes(r) ? 'checked' : ''} ${locked.includes(r) ? 'disabled' : ''}>
      <span><strong>${ROLE_LABEL[r]}</strong> <span class="muted">${ROLE_HINT[r]}</span></span></label>`).join('')}
  </fieldset>`;
}
// The ticked roles (disabled ones count), or null after showing an error when none are.
function checkedRoles(form) {
  const boxes = [...form.querySelectorAll('input[name="roles"]')];
  const roles = boxes.filter(b => b.checked).map(b => b.value);
  if (roles.length) return roles;
  fieldError(boxes.at(-1), 'Pick at least one role.');
  boxes[0].focus();
  boxes.forEach(b => b.addEventListener('change', () => clearFieldError(boxes.at(-1)), { once: true }));
  return null;
}

// One page for any user: staff (details, roles, account) or a student (details, account).
// again: redraw after a save, without the Loading… step or a jump to the top.
async function adminUser(id, again = false) {
  const t = ++navToken;
  if (!again) view(loading);
  const u = await sb.rpc('list_users').eq('id', id).maybeSingle().then(must);
  if (t !== navToken) return;
  if (!u) { location.hash = '#/users'; return; }
  const staff = u.kind === 'staff', table = staff ? 'staff' : 'students';
  const mine = isMine(u), active = !!u.last_sign_in_at;
  // Admins can't read plans or goals, so ask the database whether a student is ready for the invite.
  const ready = staff || active || await sb.rpc('student_ready', { p_id: id }).then(must);
  // Students: their row (coach and next session), who could coach them, and past coaches. Staff: the students they coach.
  const [stu, coachOpts, coaches, pupils] = await Promise.all(staff
    ? [null, [], [], sb.from('students').select('id,name').eq('coach_id', id).order('name').then(must)]
    : [sb.from('students').select('first_name,coach_id,training_ended_at,' + NEXT_COLS).eq('id', id).single().then(must),
       sb.from('staff').select('id,name,email').contains('roles', ['coach']).order('first_name').then(must),
       sb.rpc('coaches_of', { p_id: id }).then(must), []]);
  if (t !== navToken) return;
  const coachId = stu?.coach_id ?? null;
  // Keep their coach in the list even if they've lost the Coach role since.
  const cur = coaches.find(c => c.is_current);
  if (coachId && cur && !coachOpts.some(c => c.id === coachId)) coachOpts.push({ id: coachId, name: cur.name });
  const title = u.name || u.email;
  // The owner's access is theirs alone (protect_owner in schema.sql): other admins can't change their roles or remove them.
  const lockedRoles = u.owner ? (mine ? ['admin'] : STAFF_ROLES) : mine ? ['admin'] : [];
  const rolesHint = u.owner ? (mine ? "You're the owner, so you always keep the Admin role." : `${esc(u.first_name || 'The owner')} is the owner. Only they can change their roles.`)
    : mine ? "You can't remove your own Admin role. Ask another admin." : '';
  const removeBtn = mine || u.owner ? '' : `<button type="button" class="ghost danger" data-act="remove">${staff ? 'Remove Access' : 'Delete Student'}</button>`;

  view(`${crumbs([['Home', '#/'], ['Users', '#/users'], [title]])}
  <div class="row"><h1>${esc(title)}</h1>${roleTags(u.roles)}${stu?.training_ended_at ? '<span class="tag">Inactive</span>' : ''}</div>
  <div class="grid2">
    <div>
    <section class="card"><h2>Details</h2>
      ${staff ? '' : `<p class="hint">A student. ${me.isCoach ? `Their plans and goals are on <a href="#/student/${u.id}">their student page</a>.`
        : 'Coaches manage their plans and goals.'}</p>`}
      <form id="userForm" class="stack">
        <label>First Name<input name="first_name" value="${esc(u.first_name)}" required data-need="Enter their first name."></label>
        <label>Last Name<input name="last_name" value="${esc(u.last_name)}"></label>
        ${staff ? rolesFieldset(u.roles, lockedRoles) + (rolesHint ? `<p class="hint">${rolesHint}</p>` : '') : ''}
        <button class="primary">Save Details</button>
      </form>
    </section>
    ${staff ? (u.roles.includes('coach') || pupils.length ? `<section class="card"><h2>Their Students</h2>
      <p class="hint">To give a student a new coach, open them and pick one.</p>
      ${pupils.length ? `<ul class="list">${pupils.map(p => `<li><a class="item" href="#/user/${p.id}"><strong>${esc(p.name)}</strong></a></li>`).join('')}</ul>`
        : '<p class="muted">Not coaching anyone right now.</p>'}</section>` : '')
    : `<section class="card"><h2>Coach</h2>
      <p class="hint">They see their current coach and past coaches on their page.</p>
      <form id="coachForm" class="stack">
        <label>Current Coach<select name="coach_id">
          <option value="">No Coach</option>
          ${coachOpts.map(c => `<option value="${c.id}"${c.id === coachId ? ' selected' : ''}>${esc(c.name || c.email)}</option>`).join('')}
        </select></label>
        <button class="primary">Save Coach</button>
      </form>
      ${coachesHTML(coaches.filter(c => !c.is_current))}
    </section>
    ${trainingCardHTML(stu)}`}
    </div>
    <aside>
      ${staff || stu.training_ended_at ? '' : nextSessionCardHTML(stu)}
      <section class="card"><h2>Account</h2>
        ${active ? `
        <p>Signs in as ${esc(u.email)}. Last signed in ${fmtWhen(u.last_sign_in_at)}.</p>
        <div class="row"><button data-act="send-link">Send Sign-In Link</button>${removeBtn}</div>` : `
        <form id="inviteForm" class="stack">
          <p>${u.invited_at ? `Invited ${fmtWhen(u.invited_at)}, but hasn't signed in yet.` : 'Not invited yet.'}</p>
          <label>Email<input type="email" name="email" value="${esc(u.email || '')}" required data-need="Enter their email to send the invite." autocomplete="off"></label>
          <p class="hint">${u.invited_at ? 'Fix the email here if it was wrong, then resend.' : "They'll get an email with a link to choose a password."}</p>
          <div class="row"><button class="primary" id="inviteBtn">${u.invited_at ? 'Resend Invite' : 'Send Invite'}</button>${removeBtn}</div>
          <p class="hint need" id="inviteNeed" hidden></p>
        </form>`}
      </section>
    </aside>
  </div>`, { keepScroll: again });
  if (!staff) bindTraining(id, stu, () => adminUser(id, true));
  if (!staff && !stu.training_ended_at) bindNextSession(id, stu);
  if (!ready) gateInvite(me.isCoach
    ? `Save a training plan and add a goal on <a href="#/student/${u.id}">their student page</a> before sending the invite.`
    : 'A coach needs to save a training plan and add a goal before the invite can go out.');

  $('#userForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const patch = { first_name: f.get('first_name').trim(), last_name: f.get('last_name').trim() };
    if (staff && !(patch.roles = checkedRoles(e.target))) return;
    busy(e.submitter, async () => {
      must(await sb.from(table).update(patch).eq('id', id));
      if (mine) { await loadMe(me.user); setWho(); }
      flash('Details saved.');
      adminUser(id, true);
    });
  };

  const coachForm = $('#coachForm');
  if (coachForm) coachForm.onsubmit = e => {
    e.preventDefault();
    const coach_id = new FormData(e.target).get('coach_id') || null;
    if (coach_id === coachId) return flash('No change to save.');
    busy(e.submitter, async () => {
      must(await sb.from('students').update({ coach_id }).eq('id', id));
      flash(coach_id ? 'Coach saved.' : 'Coach removed.');
      adminUser(id, true);
    });
  };

  const inviteForm = $('#inviteForm');
  if (inviteForm) inviteForm.onsubmit = e => {
    e.preventDefault();
    if (!ready) return;
    const email = new FormData(e.target).get('email').trim().toLowerCase();
    busy(e.submitter, async () => {
      // Save the email first: the sign-up gate only lets listed emails create an account.
      if (email !== u.email) {
        const { error } = await sb.from(table).update({ email }).eq('id', id);
        if (error) throw error.code === '23505' ? new Error(`Another ${staff ? 'staff member' : 'student'} already has that email.`) : error;
      }
      const { error } = await sendLink(email, u.first_name, staff);
      if (error) throw error;
      must(await sb.from(table).update({ invited_at: new Date().toISOString() }).eq('id', id));
      flash(`Invite sent to ${email}.`);
      adminUser(id, true);
    });
  };

  app.onclick = async e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'send-link') busy(b, async () => {
      const { error } = await sendLink(u.email);
      if (error) throw error;
      flash(`Link sent to ${u.email}.`);
    });
    if (b.dataset.act === 'remove') {
      const ok = await ask(staff
        ? { title: `Remove ${title}?`, warn: true, ok: 'Remove Access',
            body: "<p>They won't be able to sign in, and their login is deleted. Their students stay, with no coach until you pick a new one. Plans and notes stay as they are.</p>" }
        : { title: `Delete ${title}?`, warn: true, ok: 'Delete Student',
            body: "<p>This deletes the student, all their plans, goals and notes, and their login. This can't be undone.</p>" });
      if (ok) busy(b, async () => {
        must(await sb.rpc(staff ? 'delete_staff' : 'delete_student', { p_id: id }));
        flash(`${title} ${staff ? 'removed' : 'deleted'}.`);
        goTo('#/users');
      });
    }
  };
}

// ---------- Coach: students ----------

const accountStatus = s => s.user_id ? 'Active' : s.invited_at ? 'Invited' : 'Not Invited';

async function adminStudents() {
  const t = ++navToken;
  view(loading);
  const [students, recent] = await Promise.all([
    sb.from('students').select(`id,name,email,invited_at,user_id,training_ended_at,${NEXT_COLS},plans(id,title,active)`).order('name').then(must),
    sb.from('notes').select('id,body,created_at,session:sessions(title,week,plan:plans(id,title,student:students(name)))')
      .eq('from_coach', false).order('created_at', { ascending: false }).limit(8).then(must),
  ]);
  if (t !== navToken) return;
  // Students still training first, then the ones who have finished.
  students.sort((a, b) => !!a.training_ended_at - !!b.training_ended_at);

  // Active (green) or Inactive is their training; Not Invited or Invited shows until an active student signs in.
  const rows = students.map(s => {
    const current = s.plans.filter(p => p.active).map(p => p.title || 'Untitled Plan').join(', ');
    return `<li><a class="item" href="#/student/${s.id}">
      <span><strong>${esc(s.name)}</strong><span class="item-sub">${s.email ? esc(s.email) : 'No email yet'}</span></span>
      <span class="row"><span class="muted">${current ? esc(current) : 'No current plan'}</span>
      ${s.training_ended_at ? '<span class="tag">Inactive</span>' : `
      ${nextOverdue(s) ? '<span class="tag warn">Update Next Session</span>' : ''}
      ${s.user_id ? '' : `<span class="tag">${accountStatus(s)}</span>`}
      <span class="tag ok">Active</span>`}</span></a></li>`;
  }).join('');
  const feed = recent.map(n => `<div class="note-wrap"><div class="note-meta">
      <strong>${esc(n.session?.plan?.student?.name)}</strong> · ${fmtWhen(n.created_at)} ·
      <a href="#/plan/${n.session?.plan?.id}">${esc(n.session?.plan?.title)}, Week ${n.session?.week}</a></div>
      <p>${para(n.body)}</p></div>`).join('');

  view(`${crumbs([['Home', '#/'], ['Students']])}
  <h1>Students</h1>
  <div class="grid2">
    <section class="card">${students.length ? `<ul class="list">${rows}</ul>` : '<p class="muted">No students yet. Add your first one.</p>'}</section>
    <aside>
      <section class="card"><h2>Add a Student</h2>
        <p class="hint">Build their plan and add a goal first, then add their email and send the invite from their page.</p>
        <form id="addForm" class="stack">
          <label>First Name<input name="first_name" required data-need="Enter their first name." autocomplete="off"></label>
          <label>Last Name<input name="last_name" autocomplete="off"></label>
          <button class="primary">+ Add Student</button>
        </form>
      </section>
      <section class="card feed"><h2>Latest Student Notes</h2>${feed || '<p class="muted">No notes yet.</p>'}</section>
    </aside>
  </div>`);

  $('#addForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const first_name = f.get('first_name').trim(), last_name = f.get('last_name').trim();
    busy(e.submitter, async () => {
      const data = await sb.from('students').insert({ first_name, last_name }).select('id').single().then(must);
      flash(`${first_name} added. Make their plan, then send the invite when it's ready.`);
      goTo('#/student/' + data.id);
    });
  };
}

// ---------- Coaches (students.coach_id, history from coaches_of()) ----------

// A coach who comes back has one row in coaches_of(), so they're never both current and past.
const fmtMonth = t => new Date(t).toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
const coachSpan = c => c.is_current ? 'Since ' + fmtMonth(c.started_at)
  : c.ended_at ? `${fmtMonth(c.started_at)} – ${fmtMonth(c.ended_at)}` : 'From ' + fmtMonth(c.started_at);
const coachRow = c => `<li class="coach"><span>${esc(c.name)}</span><span class="muted">${coachSpan(c)}</span></li>`;
function coachesHTML(coaches, none) {
  const cur = coaches.find(c => c.is_current), past = coaches.filter(c => !c.is_current);
  return (cur ? `<ul class="list">${coachRow(cur)}</ul>` : none ? `<p class="muted">${none}</p>` : '')
    + (past.length ? `<h3 class="goal-group">Past Coaches</h3><ul class="list">${past.map(coachRow).join('')}</ul>` : '');
}

// ---------- Next session (students.next_*: coaches and admins set it, the student reads it) ----------

const NEXT_COLS = 'next_date,next_start,next_end,next_location';
const fmtTime = t => new Date('1970-01-01T' + t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const localToday = () => new Date().toLocaleDateString('en-CA');   // YYYY-MM-DD in local time
// Once it has ended it isn't "next" any more: the student stops seeing it and the coach is asked to set a new one.
const nextPassed = s => !s.next_date || new Date(`${s.next_date}T${s.next_end}`) <= new Date();
const nextOverdue = s => !!s.next_date && nextPassed(s);
const nextDay = s => day(s.next_date).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
const nextWhen = s => `${nextDay(s)} · ${fmtTime(s.next_start)} – ${fmtTime(s.next_end)}`;

function nextSessionCardHTML(s) {
  const hm = t => t ? t.slice(0, 5) : '';
  const overdue = nextOverdue(s);
  return `<section class="card${overdue ? ' overdue' : ''}" id="nextCard">
    <div class="row between"><h2>Next Session</h2>${overdue ? '<span class="tag warn">Needs Update</span>' : ''}</div>
    <p class="hint">They see it at the top of their page until it ends.</p>
    ${overdue ? `<p class="warn-box" role="status"><strong>This session is over.</strong>
      It ended on ${esc(nextDay(s))}, so they no longer see a next session. Pick the new date and time below.</p>`
      : s.next_date ? '' : '<p class="muted">No next session set yet.</p>'}
    <form id="nextForm" class="stack">
      <label>Date<input type="date" name="next_date" value="${esc(s.next_date || '')}" min="${localToday()}"
        required data-need="Pick the day." data-low="Pick today or a later day."></label>
      <div class="row">
        <label class="grow" style="min-width:120px">Start Time<input type="time" name="next_start" value="${hm(s.next_start)}" required data-need="Pick a start time."></label>
        <label class="grow" style="min-width:120px">End Time<input type="time" name="next_end" value="${hm(s.next_end)}" required data-need="Pick an end time."></label>
      </div>
      <label>Location<input name="next_location" value="${esc(s.next_location || '')}" maxlength="200" required
        data-need="Say where it is." autocomplete="off" placeholder="e.g. Gym/Wall"></label>
      <div class="row"><button class="primary">Save Session</button>
        ${s.next_date ? '<button type="button" class="ghost danger" data-act="next-clear">Clear</button>' : ''}</div>
    </form>
  </section>`;
}

// Saves or clears the next session, then redraws the card in place.
function bindNextSession(id, s) {
  const draw = () => {
    $('#nextCard').outerHTML = nextSessionCardHTML(s);
    bindNextSession(id, s);
  };
  const save = (btn, patch, msg) => busy(btn, async () => {
    Object.assign(s, await sb.from('students').update(patch).eq('id', id).select(NEXT_COLS).single().then(must));
    draw();
    flash(msg);
  });
  const form = $('#nextForm');
  form.onsubmit = e => {
    e.preventDefault();
    const f = new FormData(form), start = f.get('next_start'), end = f.get('next_end');
    if (end <= start) return fieldError(form.elements.next_end, 'End after the start time.');
    save(e.submitter, { next_date: f.get('next_date'), next_start: start, next_end: end,
      next_location: f.get('next_location').trim() }, 'Next session saved.');
  };
  form.querySelector('[data-act="next-clear"]')?.addEventListener('click', async e => {
    e.stopPropagation();   // not the page's own data-act handler
    if (await ask({ title: 'Clear the Next Session?', body: "<p>They won't see a next session until you set one.</p>", ok: 'Clear', warn: true }))
      save(e.target, { next_date: null, next_start: null, next_end: null, next_location: null }, 'Next session cleared.');
  });
}

// ---------- Training status (students.training_ended_at: null while they train) ----------

function trainingCardHTML(s) {
  const done = s.training_ended_at;
  return `<section class="card" id="trainingCard">
    <div class="row between"><h2>Training</h2><span class="tag${done ? '' : ' ok'}">${done ? 'Inactive' : 'Active'}</span></div>
    <p class="hint">${done ? `Finished training ${fmtDay(done)}. Their plans, goals and notes are kept, and they can still sign in.`
      : 'When they stop personal training, end it here. They move to Inactive on the Students list.'}</p>
    <button type="button" class="${done ? 'primary' : 'ghost'}" data-act="training">${done ? 'Resume Training' : 'End Training'}</button>
  </section>`;
}

// Ends their training (clearing the next session) or resumes it, then redraw() the page.
function bindTraining(id, s, redraw) {
  $('#trainingCard [data-act="training"]').addEventListener('click', async e => {
    e.stopPropagation();   // not the page's own data-act handler
    const done = !s.training_ended_at, btn = e.currentTarget;
    if (done && !await ask({ title: `End ${s.first_name}'s Training?`, ok: 'End Training',
      body: "<p>They move to Inactive and their next session is cleared. Plans, goals and notes stay, and they can still sign in.</p>" })) return;
    busy(btn, async () => {
      must(await sb.from('students').update(done
        ? { training_ended_at: new Date().toISOString(), next_date: null, next_start: null, next_end: null, next_location: null }
        : { training_ended_at: null }).eq('id', id));
      flash(done ? `Training ended for ${s.first_name}.` : `Training resumed for ${s.first_name}.`);
      redraw();
    });
  });
}

// What the student sees: nothing once the day has passed.
const nextSessionAlert = s => s && !nextPassed(s) ? `<div class="alert next-session"><strong>Next session:</strong>
  ${esc(nextWhen(s))}<br><span class="muted">${esc(s.next_location)}</span></div>` : '';

// ---------- Goals (current → achieved or archived) ----------

const fmtDay = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
// Current goals oldest first; achieved and archived newest first.
const sortGoals = goals => goals.sort((a, b) =>
  ((b.status === 'current') - (a.status === 'current')) ||
  (a.status === 'current' ? a.created_at.localeCompare(b.created_at) : (b.done_at || '').localeCompare(a.done_at || '')));
const goalItem = (g, sub, right) => `<li class="goal"><div class="goal-text"><p>${para(g.body)}</p>
  ${sub ? `<span class="item-sub">${sub}</span>` : ''}</div>${right}</li>`;

function coachGoalsHTML(goals) {
  const by = st => goals.filter(g => g.status === st);
  const cur = by('current'), won = by('achieved'), old = by('archived');
  const btns = (g, ...list) => `<div class="row">${list.map(([act, label, cls]) =>
    `<button type="button" class="small ${cls || 'ghost'}" data-act="${act}" data-goal="${g.id}">${label}</button>`).join('')}</div>`;
  return `<h2>Goals</h2>
    <p class="hint">They see current and achieved goals on their page. Archived goals are hidden from them.</p>
    ${cur.length ? `<ul class="list">${cur.map(g => goalItem(g, '',
      btns(g, ['goal-achieved', 'Achieved', 'primary'], ['goal-edit', 'Edit'], ['goal-archive', 'Archive']))).join('')}</ul>`
      : '<p class="muted">No current goals.</p>'}
    <form id="goalForm" class="row" style="margin-top:.6rem">
      <input name="body" class="grow" maxlength="500" required data-need="Write the goal first." autocomplete="off" placeholder="e.g. Send a V5 by spring">
      <button class="primary">+ Add Goal</button>
    </form>
    ${won.length ? `<h3 class="goal-group">Achieved</h3><ul class="list">${won.map(g => goalItem(g, 'Achieved ' + fmtDay(g.done_at),
      btns(g, ['goal-current', 'Undo'], ['goal-archive', 'Archive']))).join('')}</ul>` : ''}
    ${old.length ? `<details class="goal-group"><summary>Archived (${old.length})</summary><ul class="list">${old.map(g =>
      goalItem(g, 'Archived ' + fmtDay(g.done_at), btns(g, ['goal-current', 'Restore'], ['goal-delete', 'Delete', 'ghost danger']))).join('')}</ul></details>` : ''}`;
}

// again: redraw after a change, without the Loading… step or a jump to the top.
async function adminStudent(id, again = false) {
  const t = ++navToken;
  if (!again) view(loading);
  const [s, coaches] = await Promise.all([
    sb.from('students').select('*, plans(id,title,active,start_date,updated_at), goals(*)').eq('id', id).maybeSingle().then(must),
    sb.rpc('coaches_of', { p_id: id }).then(must),
  ]);
  if (t !== navToken) return;
  if (!s) { location.hash = '#/students'; return; }
  s.plans.sort((a, b) => (b.active - a.active) || b.updated_at.localeCompare(a.updated_at));
  sortGoals(s.goals);

  const plans = s.plans.map(p => `<li><a class="item" href="#/plan/${p.id}">
    <span><strong>${esc(p.title || 'Untitled Plan')}</strong><span class="item-sub">${p.start_date ? fmtStart(p.start_date) : 'No start date'}</span></span>
    ${p.active ? '<span class="tag ok">Current</span>' : '<span class="tag">Past</span>'}</a></li>`).join('');

  view(`${crumbs([['Home', '#/'], ['Students', '#/students'], [s.name]])}
  <div class="row"><h1>${esc(s.name)}</h1>${s.training_ended_at ? '<span class="tag">Inactive</span>' : ''}</div>
  <div class="grid2">
    <div>
      <section class="card">
        <div class="row between"><h2>Training Plans</h2><button class="primary" data-act="new-plan">+ New Plan</button></div>
        ${plans ? `<ul class="list">${plans}</ul>` : '<p class="muted">No plans yet.</p>'}
      </section>
      <section class="card" id="goalsCard"></section>
      ${trainingCardHTML(s)}
    </div>
    <aside>
      ${s.training_ended_at ? '' : nextSessionCardHTML(s)}
      <section class="card"><h2>Details</h2>
        <p class="hint">Emails and their page greet them by first name.</p>
        <form id="stuForm" class="stack">
          <label>First Name<input name="first_name" value="${esc(s.first_name)}" required data-need="Enter their first name."></label>
          <label>Last Name<input name="last_name" value="${esc(s.last_name)}"></label>
          <button class="primary">Save Details</button>
        </form>
      </section>
      <section class="card"><h2>Coach</h2>
        <p class="hint">${me.isAdmin ? `Change it on <a href="#/user/${id}">their user page</a>.` : 'An admin can change their coach.'}</p>
        ${coachesHTML(coaches, 'No coach yet.')}</section>
      <section class="card"><h2>Account</h2>
        ${s.user_id ? `
        <p>Signs in as ${esc(s.email)}.</p>
        <div class="row"><button data-act="send-link">Send Sign-In Link</button>
        <button class="ghost danger" data-act="del-student">Delete Student</button></div>` : `
        <form id="inviteForm" class="stack">
          <p>${s.invited_at ? `Invited ${fmtWhen(s.invited_at)}, but hasn't signed in yet.` : 'Not invited yet.'}</p>
          <label>Email<input type="email" name="email" value="${esc(s.email || '')}" required data-need="Enter their email to send the invite." autocomplete="off"></label>
          <p class="hint">${s.invited_at ? 'Fix the email here if it was wrong, then resend.' : "They'll get an email saying their plan is ready, with a link to choose a password."}</p>
          <div class="row"><button class="primary" id="inviteBtn">${s.invited_at ? 'Resend Invite' : 'Send Invite'}</button>
          <button type="button" class="ghost danger" data-act="del-student">Delete Student</button></div>
          <p class="hint need" id="inviteNeed" hidden></p>
        </form>`}
      </section>
    </aside>
  </div>`, { keepScroll: again });
  bindTraining(id, s, () => adminStudent(id, true));
  if (!s.training_ended_at) bindNextSession(id, s);

  $('#stuForm').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    busy(e.submitter, async () => {
      must(await sb.from('students').update({
        first_name: f.get('first_name').trim(), last_name: f.get('last_name').trim(),
      }).eq('id', id));
      flash('Details saved.');
      adminStudent(id);
    });
  };

  // The invite waits for a saved plan (new plans have no title until saved) and a goal. Matches student_ready().
  const inviteNeed = () => {
    const need = [!s.plans.some(p => p.title) && 'save a training plan', !s.goals.length && 'add a goal'].filter(Boolean);
    return need.length ? `${need.join(' and ').replace(/^./, c => c.toUpperCase())} before sending the invite.` : '';
  };

  // Goals change in place, so the rest of the page (and the scroll) stays put.
  function renderGoals(focusAdd) {
    gateInvite(inviteNeed());
    $('#goalsCard').innerHTML = coachGoalsHTML(s.goals);
    const form = $('#goalForm');
    if (focusAdd) form.elements.body.focus();
    form.onsubmit = e => {
      e.preventDefault();
      const body = form.elements.body.value.trim();
      if (!body) return;
      busy(e.submitter, async () => {
        s.goals.push(await sb.from('goals').insert({ student_id: id, body }).select().single().then(must));
        sortGoals(s.goals);
        renderGoals(true);
      });
    };
  }
  const saveGoal = (b, g, patch, msg) => busy(b, async () => {
    Object.assign(g, await sb.from('goals').update(patch).eq('id', g.id).select().single().then(must));
    sortGoals(s.goals);
    renderGoals();
    if (msg) flash(msg);
  });
  renderGoals();

  const inviteForm = $('#inviteForm');
  if (inviteForm) inviteForm.onsubmit = e => {
    e.preventDefault();
    if (inviteNeed()) return;
    const email = new FormData(e.target).get('email').trim().toLowerCase();
    busy(e.submitter, async () => {
      // Save the email first: the sign-up gate only lets listed emails create an account.
      if (email !== s.email) {
        const { error } = await sb.from('students').update({ email }).eq('id', id);
        if (error) throw error.code === '23505' ? new Error('Another student already has that email.') : error;
      }
      const { error } = await sendLink(email, s.first_name);
      if (error) throw error;
      must(await sb.from('students').update({ invited_at: new Date().toISOString() }).eq('id', id));
      flash(`Invite sent to ${email}.`);
      adminStudent(id);
    });
  };

  app.onclick = async e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act, g = s.goals.find(x => x.id === b.dataset.goal);
    if (g) {
      if (act === 'goal-edit') {
        const f = await ask({ title: 'Edit Goal', ok: 'Save Goal',
          body: `<label>Goal<textarea name="body" rows="3" maxlength="500" required data-need="Write the goal.">${esc(g.body)}</textarea></label>` });
        const body = f?.get('body').trim();
        if (body) saveGoal(b, g, { body });
      } else if (act === 'goal-delete') {
        if (await ask({ title: 'Delete This Goal?', body: "<p>This can't be undone. To just hide it, keep it archived.</p>", ok: 'Delete', warn: true }))
          busy(b, async () => {
            must(await sb.from('goals').delete().eq('id', g.id));
            s.goals = s.goals.filter(x => x !== g);
            renderGoals();
          });
      } else {
        const status = { 'goal-achieved': 'achieved', 'goal-archive': 'archived', 'goal-current': 'current' }[act];
        saveGoal(b, g, { status, done_at: status === 'current' ? null : new Date().toISOString() },
          { achieved: 'Goal marked achieved.', archived: 'Goal archived.', current: 'Goal is current again.' }[status]);
      }
      return;
    }
    // Ask before making the plan, so cancelling doesn't leave an empty one behind.
    if (b.dataset.act === 'new-plan' && await okToLeave()) busy(b, async () => {
      const p = await sb.from('plans').insert({ student_id: id, title: '', active: !s.plans.some(x => x.active) })
        .select('id').single().then(must);
      goTo('#/plan/' + p.id);
    });
    if (b.dataset.act === 'send-link') busy(b, async () => {
      const { error } = await sendLink(s.email);
      if (error) throw error;
      flash(`Link sent to ${s.email}.`);
    });
    if (b.dataset.act === 'del-student') {
      const n = s.plans.length;
      const ok = await ask({ title: `Delete ${s.name}?`, warn: true, ok: 'Delete Student',
        body: `<p>This deletes ${n ? `their ${n} plan${n > 1 ? 's' : ''}, all notes` : 'them from your list'}
        and their login. This can't be undone.</p>` });
      if (ok) busy(b, async () => {
        must(await sb.rpc('delete_student', { p_id: id }));
        flash(`${s.name} deleted.`);
        goTo('#/students');
      });
    }
  };
}

// ---------- Staff: master exercise list ----------

// Plans copy an exercise's values when it's picked, so editing either one never changes the other.
const EX_FIELDS = [['sets', 'Sets'], ['reps', 'Reps / Time'], ['rest', 'Rest'], ['notes', 'Notes']];
const exKey = name => String(name ?? '').trim().toLowerCase();   // matches exercises.name_key
const exDupError = e => e.code === '23505' ? new Error('That exercise is already on the list.') : e;
const exFieldsHTML = (x = {}) => `<label>Name<input name="name" value="${esc(x.name)}" maxlength="200" required
    data-need="Name the exercise." autocomplete="off"></label>
  <div class="row">${EX_FIELDS.slice(0, 3).map(([f, l]) =>
    `<label class="grow" style="min-width:90px">${l}<input name="${f}" value="${esc(x[f])}" autocomplete="off"></label>`).join('')}</div>
  <label>Notes<textarea name="notes" rows="2">${esc(x.notes)}</textarea></label>`;
const exFromForm = f => Object.fromEntries(['name', ...EX_FIELDS.map(([k]) => k)].map(k => [k, (f.get(k) || '').trim()]));

async function adminExercises() {
  const t = ++navToken;
  view(loading);
  let list = await sb.from('exercises').select('*').order('name_key').then(must);
  if (t !== navToken) return;

  view(`${crumbs([['Home', '#/'], ['Master Exercise List']])}
  <h1>Master Exercise List</h1>
  <div class="grid2">
    <section class="card">
      <input id="exSearch" type="search" placeholder="Search exercises" aria-label="Search exercises" autocomplete="off">
      <ul class="list" id="exList" style="margin-top:.6rem"></ul>
    </section>
    <aside>
      <section class="card"><h2>Add Exercise</h2>
        <p class="hint">Picking an exercise in a training plan fills in these values. Changing them in a plan doesn't change this list.
          New exercises typed into a plan are added here when the plan is saved.</p>
        <form id="exAdd" class="stack">${exFieldsHTML()}<button class="primary">+ Add Exercise</button></form>
      </section>
    </aside>
  </div>`);

  const search = $('#exSearch');
  function renderList() {
    const q = exKey(search.value);
    const shown = list.filter(x => !q || x.name_key.includes(q));
    $('#exList').innerHTML = shown.map(x => {
      const sub = EX_FIELDS.slice(0, 3).filter(([f]) => x[f]).map(([f, l]) => `${l} ${esc(x[f])}`).join(' · ');
      return `<li class="goal"><div class="goal-text"><strong>${esc(x.name)}</strong>
        ${sub ? `<span class="item-sub">${sub}</span>` : ''}${x.notes ? `<span class="item-sub">${para(x.notes)}</span>` : ''}</div>
        <div class="row"><button type="button" class="small ghost" data-act="ex-edit" data-ex="${x.id}">Edit</button>
        <button type="button" class="small ghost danger" data-act="ex-delete" data-ex="${x.id}">Delete</button></div></li>`;
    }).join('') || `<li><p class="muted" style="margin:.6rem 0">${list.length ? 'No exercise matches that search.' : 'No exercises yet. Add your first one.'}</p></li>`;
  }
  const sortList = () => list.sort((a, b) => a.name_key.localeCompare(b.name_key));
  renderList();
  search.oninput = renderList;

  $('#exAdd').onsubmit = e => {
    e.preventDefault();
    const row = exFromForm(new FormData(e.target));
    busy(e.submitter, async () => {
      const { data, error } = await sb.from('exercises').insert(row).select().single();
      if (error) throw exDupError(error);
      list.push(data); sortList();
      e.target.reset();
      search.value = '';
      renderList();
      e.target.elements.name.focus();
      flash(`${data.name} added.`);
    });
  };

  app.onclick = async e => {
    const b = e.target.closest('[data-act]');
    const x = b && list.find(y => y.id === b.dataset.ex);
    if (!x) return;
    if (b.dataset.act === 'ex-edit') {
      const f = await ask({ title: 'Edit Exercise', ok: 'Save Exercise', body: `<div class="stack">${exFieldsHTML(x)}</div>
        <p class="hint">Plans that already use it keep their own values.</p>` });
      if (f) busy(b, async () => {
        const { data, error } = await sb.from('exercises').update(exFromForm(f)).eq('id', x.id).select().single();
        if (error) throw exDupError(error);
        Object.assign(x, data); sortList();
        renderList();
        flash('Exercise saved.');
      });
    }
    if (b.dataset.act === 'ex-delete' && await ask({ title: `Delete ${x.name}?`, warn: true, ok: 'Delete',
      body: '<p>It comes off the list. Plans that already use it keep it.</p>' }))
      busy(b, async () => {
        must(await sb.from('exercises').delete().eq('id', x.id));
        list = list.filter(y => y !== x);
        renderList();
      });
  };
}

// Adds a plan's exercises that aren't on the master list yet, with the plan's values.
// Existing names are left alone (ignoreDuplicates), so plan edits never change the list.
async function addToMasterList(rows) {
  const known = new Set(draft.library.map(x => x.name_key)), add = new Map();
  for (const x of rows.flatMap(r => r.exercises)) {
    const k = exKey(x.name);
    if (k && !known.has(k) && !add.has(k))
      add.set(k, { name: x.name.trim().slice(0, 200), ...Object.fromEntries(EX_FIELDS.map(([f]) => [f, String(x[f] ?? '').trim()])) });
  }
  if (!add.size) return 0;
  const added = await sb.from('exercises').upsert([...add.values()], { onConflict: 'name_key', ignoreDuplicates: true })
    .select().then(must);
  draft.library.push(...added);
  return added.length;
}

// The exercise name picker: one menu under whichever name field has focus, listing master
// exercises that contain what's typed (names starting with it first). Picking one sets the
// field and fires an input event, so the editor's oninput fills in the values as for typing.
const exMenu = Object.assign(document.createElement('ul'), { id: 'exMenu', className: 'combo-menu', role: 'listbox', hidden: true });
exMenu.setAttribute('aria-label', 'Exercises');
document.body.append(exMenu);
let exMenuFor = null, exMatches = [], exActive = -1;

function exMenuOpen(input) {
  const q = exKey(input.value);
  exMatches = (draft?.library ?? []).filter(x => x.name_key.includes(q))
    .sort((a, b) => (b.name_key.startsWith(q) - a.name_key.startsWith(q)) || a.name_key.localeCompare(b.name_key));
  if (!exMatches.length || (exMatches.length === 1 && exMatches[0].name_key === q)) return exMenuClose();
  exMenuFor = input; exActive = -1;
  const hit = s => { const i = s.toLowerCase().indexOf(q);
    return q && i >= 0 ? `${esc(s.slice(0, i))}<mark>${esc(s.slice(i, i + q.length))}</mark>${esc(s.slice(i + q.length))}` : esc(s); };
  exMenu.innerHTML = exMatches.map((x, k) => {
    const sum = [x.sets && x.reps ? `${x.sets} × ${x.reps}` : x.sets || x.reps, x.rest].filter(Boolean).join(' · ');
    return `<li id="exOpt${k}" role="option" data-k="${k}"><span>${hit(x.name)}</span>${sum ? `<span class="muted">${esc(sum)}</span>` : ''}</li>`;
  }).join('');
  const r = input.getBoundingClientRect();
  const vw = document.documentElement.clientWidth, w = Math.min(Math.max(r.width, 320), vw - 16);
  Object.assign(exMenu.style, { left: Math.max(8, Math.min(r.left, vw - w - 8)) + scrollX + 'px', top: r.bottom + scrollY + 4 + 'px', width: w + 'px' });
  exMenu.hidden = false; exMenu.scrollTop = 0;
  input.setAttribute('aria-expanded', 'true');
  input.removeAttribute('aria-activedescendant');
}

function exMenuClose() {
  exMenu.hidden = true;
  exMenuFor?.setAttribute('aria-expanded', 'false');
  exMenuFor?.removeAttribute('aria-activedescendant');
  exMenuFor = null;
}

function exMenuMove(k) {
  exActive = (k + exMatches.length) % exMatches.length;
  exMenu.querySelectorAll('li').forEach((li, j) => li.setAttribute('aria-selected', j === exActive));
  const li = exMenu.children[exActive];
  li.scrollIntoView({ block: 'nearest' });
  exMenuFor.setAttribute('aria-activedescendant', li.id);
}

function exMenuPick(k) {
  const input = exMenuFor;
  input.value = exMatches[k].name;
  exMenuClose();
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

document.addEventListener('focusin', e => { if (e.target.matches?.('[data-combo]')) exMenuOpen(e.target); });
document.addEventListener('focusout', e => { if (e.target === exMenuFor) exMenuClose(); });
document.addEventListener('input', e => { if (e.target.matches?.('[data-combo]') && e.isTrusted) exMenuOpen(e.target); });
document.addEventListener('keydown', e => {
  if (!e.target.matches?.('[data-combo]')) return;
  if (e.target !== exMenuFor) { if (e.key === 'ArrowDown') { exMenuOpen(e.target); e.preventDefault(); } return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { exMenuMove(exActive + (e.key === 'ArrowDown' ? 1 : -1)); e.preventDefault(); }
  else if (e.key === 'Enter' && exActive >= 0) { exMenuPick(exActive); e.preventDefault(); }
  else if (e.key === 'Escape') { exMenuClose(); e.preventDefault(); }
  else if (e.key === 'Tab') exMenuClose();
});
exMenu.addEventListener('mousedown', e => e.preventDefault());   // keep focus in the field
exMenu.addEventListener('click', e => { const li = e.target.closest('li'); if (li) exMenuPick(+li.dataset.k); });
addEventListener('resize', () => exMenuFor && exMenuOpen(exMenuFor));

// ---------- Coach: plan editor ----------

const blankEx = () => ({ name: '', sets: '', reps: '', rest: '', notes: '' });
const blankSession = week => ({ id: crypto.randomUUID(), week, title: '', details: '', exercises: [blankEx()] });

async function adminPlan(id) {
  const t = ++navToken;
  view(loading);
  const [plan, sessions, library] = await Promise.all([
    sb.from('plans').select('*, student:students(id,name)').eq('id', id).maybeSingle().then(must),
    sb.from('sessions').select('*').eq('plan_id', id).order('week').order('position').then(must),
    sb.from('exercises').select('*').then(must),
  ]);
  if (t !== navToken) return;
  if (!plan) { location.hash = '#/'; return; }
  const notes = sessions.length
    ? await sb.from('notes').select('*').in('session_id', sessions.map(s => s.id)).order('created_at').then(must) : [];
  if (t !== navToken) return;

  // library: the master exercise list, for the Exercise picker.
  draft = { plan, sessions, library, savedIds: new Set(sessions.map(s => s.id)), preview: false };
  notesCtx = { notes, studentName: plan.student.name };
  dirty = false;
  renderEditor();
  window.scrollTo(0, 0);
}

function displayOrder() {
  const S = draft.sessions;
  return S.map((_, i) => i).sort((a, b) => (S[a].week - S[b].week) || (a - b));
}

function byWeek(list) {
  const weeks = new Map();
  for (const x of list) {
    if (!weeks.has(x.week)) weeks.set(x.week, []);
    weeks.get(x.week).push(x);
  }
  return [...weeks];
}

function markDirty() {
  dirty = true;
  const el = $('#saveState');
  if (el) { el.textContent = 'Unsaved changes'; el.classList.add('warn'); }
}

function sessionEditHTML(s, i) {
  const f = (field, ph, e) => `<input data-s="${i}"${e != null ? ` data-e="${e}"` : ''} data-f="${field}" placeholder="${ph}" aria-label="${ph}"
    ${field === 'name' && e != null ? 'data-combo role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="exMenu" maxlength="200" autocomplete="off"' : ''}
    value="${esc(e != null ? s.exercises[e][field] : s[field])}">`;
  return `<article class="card session-edit">
    <div class="row">
      <label class="wk">Week<input type="number" min="1" data-s="${i}" data-f="week" value="${s.week}"></label>
      <label class="grow">Session<input data-s="${i}" data-f="title" value="${esc(s.title)}" placeholder="e.g. Limit bouldering"></label>
    </div>
    <label style="margin-top:.6rem">Details<textarea data-s="${i}" data-f="details" rows="2"
      placeholder="Warm-up, focus, how hard to go…">${esc(s.details)}</textarea></label>
    ${s.exercises.length ? '<div class="ex-head"><span>Exercise</span><span>Sets</span><span>Reps / Time</span><span>Rest</span><span>Notes</span><span></span></div>' : ''}
    ${s.exercises.map((_, e) => `<div class="ex-row">${f('name', 'Exercise', e)}${f('sets', 'Sets', e)}${f('reps', 'Reps / Time', e)}${f('rest', 'Rest', e)}${f('notes', 'Notes', e)}
